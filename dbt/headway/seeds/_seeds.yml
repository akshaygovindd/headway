version: 2

seeds:
  - name: quality_thresholds
    description: Warn and fail thresholds of each hourly quality check.
    config:
      meta:
        grain: check_name
    data_tests:
      - unique_grain:
          arguments:
            columns: [check_name]
    columns:
      - name: check_name
        description: Name of the check the thresholds apply to.
        data_tests: [not_null]
      - name: direction
        description: "above: bad when the value is at or above a threshold; below: bad when under it."
        data_tests:
          - accepted_values:
              arguments:
                values: [above, below]
      - name: warn
        description: Value at which the check warns.
        data_tests: [not_null]
      - name: fail
        description: Value at which the check fails.
        data_tests: [not_null]

  - name: slo_targets
    description: Service level objectives of the pipeline (docs/SLO.md) with their targets.
    config:
      meta:
        grain: slo_name
    data_tests:
      - unique_grain:
          arguments:
            columns: [slo_name]
    columns:
      - name: slo_name
        description: Name of the objective.
        data_tests: [not_null]
      - name: target_pct
        description: Share of good events (0-100) the objective requires.
        data_tests: [not_null]
      - name: threshold
        description: Objective-specific limit; for gold_freshness the maximum age of gold in minutes. Empty when the objective has none.
      - name: event_unit
        description: What one event is - minutes, hours, runs or trip stops.
        data_tests: [not_null]
      - name: description
        description: What counts as a good event.

  - name: official_speed_restrictions
    description: "The MBTA's speed restrictions, typed in by hand from its public page and committed with no rows until captured (ADR-025, RUNBOOK). All columns are text; stg_official_speed_restrictions types them. Never filled by a program."
    config:
      meta:
        grain: restriction_id
    columns:
      - name: restriction_id
        description: "Identifier chosen by the person capturing the list."
      - name: line
        description: "Line, as in the data (Red, Orange, Blue, Green-B, ...)."
      - name: location_text
        description: "Location as the MBTA words it."
      - name: direction
        description: "Direction as the MBTA words it, if given."
      - name: speed_limit_mph
        description: "Speed limit in miles per hour."
      - name: reason
        description: "Reason the MBTA gives."
      - name: date_reported
        description: "Date first reported (YYYY-MM-DD)."
      - name: source_url
        description: "Public page the row was copied from."
      - name: captured_on
        description: "Date the row was captured (YYYY-MM-DD)."

  - name: official_restriction_segments
    description: "Which segments each speed restriction covers: one row per restriction and segment, kept by hand next to the snapshot. A restriction without a row stays visible as listed_unmapped."
    config:
      meta:
        grain: "restriction_id x direction_id x from_stop_id x to_stop_id"
    columns:
      - name: restriction_id
        description: "Id of a row of official_speed_restrictions."
      - name: line
        description: "Line of the segment."
      - name: direction_id
        description: "GTFS direction of the segment (0 or 1)."
      - name: from_stop_id
        description: "Platform stop id where the segment starts (as in agg_headway_segment_window)."
      - name: to_stop_id
        description: "Platform stop id where the segment ends."
