        description: "Pairs dropped for lack of a scheduled headway."
      - name: n_dropped_implausible
        description: "Pairs dropped as implausibly long."
      - name: n_excluded_outage
        description: "Candidate headways left out because the hour is an outage."
      - name: scheduled_headways
        description: "Scheduled stop times of the hour with a predecessor at their stop."
      - name: coverage_numerator
        description: "Numerator of coverage."
      - name: coverage_denominator
