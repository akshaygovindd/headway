    config:
      meta:
        grain: "line x alert_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, alert_id]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: alert_id
        description: "MBTA alert identifier."
        data_tests:
          - not_null
      - name: effect
        description: "GTFS-realtime alert effect."
      - name: header_text
        description: "Header text of the alert as published by the MBTA (public text), from its latest sighting."
      - name: first_seen
        description: "First capture in the window in which the alert was active (UTC)."
      - name: last_seen
        description: "Last capture in the window in which the alert was active (UTC)."
      - name: is_active
        description: "True when the alert was active in the latest hour of the window."
      - name: n_stations
        description: "Stations the alert covers."
      - name: from_station_name
        description: "First affected station along direction 0 of the line; null when it is not on a segment."
      - name: to_station_name
        description: "Last affected station along direction 0 of the line; null when it is not on a segment."
      - name: segment_keys
        description: "Affected segments of agg_headway_segment_window (last_24h) as direction_id:from_stop_id:to_stop_id: segments starting or ending at an affected station."
  - name: agg_trip_time_budget
    description: "Travel time between two stations of a line per direction, time band and window (Release 4, Phase 4.5): median, 95th percentile and buffer time index of high/medium reconstructed arrivals of the same trip, with n trips and coverage. Every ordered pair of distinct stations a scheduled trip serves. The API withholds below 50 percent coverage or 20 trips. Exported with the R4 gold tables."
    config:
      meta:
        grain: "line x direction_id x from_station_id x to_station_id x time_band x window_label"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, from_station_id, to_station_id, time_band, window_label]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "GTFS direction of the trips."
      - name: from_station_id
        description: "Parent station of the stop where the ride starts."
        data_tests:
          - not_null
      - name: from_station_name
        description: "Name of the from station."
      - name: to_station_id
        description: "Parent station of the stop where the ride ends; later in the trip than the from station."
        data_tests:
          - not_null
      - name: to_station_name
        description: "Name of the to station."
      - name: time_band
        description: "am_peak, midday, pm_peak, evening or other, by the scheduled arrival at the from station (local)."
        data_tests:
          - not_null
      - name: window_label
        description: "last_24h or last_7d, by the arrival hour at the from station, ending at the latest hour of the export."
        data_tests:
          - not_null
      - name: n_scheduled_trips
        description: "Scheduled trips serving both stations, outage trips excluded."
      - name: n_excluded_outage
        description: "Trips left out because the hour at either station is a data outage."
      - name: n_implausible
        description: "Trips with a travel time of zero or less or over 3 hours, left out of the statistics."
      - name: n_trips
        description: "Trips behind the statistics; zero when no trip was measured."
      - name: n_disruption
        description: "Trips behind the statistics with a service-disruption alert at either end (kept)."
      - name: median_s
        description: "Median travel time in seconds."
      - name: p95_s
        description: "95th percentile of the travel time in seconds."
      - name: buffer_time_index
        description: "(p95 - median) / median; null without a median."
      - name: coverage_numerator
        description: "Numerator of coverage: measured trips."
      - name: coverage_denominator
        description: "Denominator of coverage: scheduled trips in non-outage hours."
      - name: coverage_pct
        description: "Measured over scheduled trips as a percentage (0-100); null when the denominator is zero."
