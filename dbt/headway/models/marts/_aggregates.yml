  - name: agg_ett_daily
    description: "ETT approximation per line, direction, service date, time band, day type and service-disruption label: arrival at the second-to-last stop minus the second stop, minus the scheduled running time, from high and medium reconstructed arrivals. An adapted approximation, not an official measure."
    config:
      meta:
        grain: "line x direction_id x service_date x time_band x day_type x service_disruption"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, time_band, day_type, service_disruption]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: time_band
        description: "am_peak, midday, pm_peak, evening or other, by the scheduled arrival at the second stop."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [am_peak, midday, pm_peak, evening, other]
      - name: day_type
        description: "weekday or weekend."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [weekday, weekend]
      - name: service_disruption
        description: "True when the line had a service-disruption alert in an hour of either end stop."
        data_tests:
          - not_null
      - name: n_scheduled_trips
        description: "Scheduled trips of the group, outage trips excluded."
      - name: n_excluded_outage
        description: "Trips left out because an end stop's hour is a data outage."
      - name: n_implausible
        description: "Trips with an ETT beyond 3600 seconds, left out of the statistics."
      - name: n_trips
        description: "Trips behind the statistics."
        data_tests:
          - not_null
      - name: median_ett_s
        description: "Median ETT in seconds; positive is slower than schedule."
      - name: p90_ett_s
        description: "90th percentile of ETT in seconds."
      - name: coverage_numerator
        description: "Numerator of coverage."
      - name: coverage_denominator
        description: "Denominator of coverage."
      - name: coverage_pct
        description: "Coverage as a percentage (0-100); null when the denominator is zero or the hour is an outage."
  - name: agg_accuracy_window
    description: "Prediction accuracy per line and horizon bucket over the last 24 hours and the last 7 days, computed over every error in the window (not from daily medians). Outage hours are excluded and counted."
    config:
      meta:
        grain: "line x window_label x horizon_bucket"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, window_label, horizon_bucket]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: window_label
        description: "last_24h or last_7d, ending at the latest hour of the export (metrics_as_of)."
        data_tests:
          - not_null
      - name: horizon_bucket
        description: "Horizon bucket in minutes: 0-5, 5-10, 10-20 or 20-30."
        data_tests:
          - not_null
      - name: n
        description: "Errors behind the statistics."
        data_tests:
          - not_null
      - name: n_excluded_outage
        description: "Errors left out because the arrival hour was a data outage."
      - name: n_disruption
        description: "Errors from hours with an active service-disruption alert (kept in the statistics)."
      - name: median_abs_error_s
