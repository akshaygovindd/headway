version: 2

models:
  - name: agg_line_reliability_hourly
    description: "Prediction reliability per line, direction, service date and scheduled hour. Rows exist only for hours inside the trip_updates observation window."
    config:
      meta:
        grain: "line x direction_id x service_date x hour_local"
    data_tests:
      # Elementary anomaly detection (ADR-018): warn only, never blocks an export.
      - elementary.volume_anomalies:
          config:
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: service_date
          config:
            severity: warn
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line (route_id)."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23) of the scheduled arrival."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: median_predicted_deviation_s
        description: "Median predicted minus scheduled arrival in seconds over eligible predictions; null without any."
      - name: p90_predicted_deviation_s
        description: "90th percentile of predicted deviation in seconds."
      - name: median_abs_revision_s
        description: "Median absolute revision in seconds over eligible predictions with a prior snapshot."
      - name: n_eligible
        description: "Eligible predictions (one per trip stop)."
        data_tests:
          - not_null
      - name: implausible_deviation_count
        description: "Trip stops whose last-snapshot pick deviates more than 3600 s from the schedule; excluded from deviation and revision, still covered."
        data_tests:
          - not_null
      - name: coverage_numerator
        description: "Scheduled trip stops with at least one usable observation: non-duplicate, schedule-matched, not NO_DATA, collected 0-30 minutes before the scheduled arrival. SKIPPED stops count as covered."
        data_tests:
          - not_null
      - name: observable_trip_stops
        description: "Scheduled trip stops in the hour that could have been observed: at least one ok, non-duplicate trip_updates capture fetched within 30 minutes up to the scheduled arrival."
        data_tests:
          - not_null
      - name: scheduled_trip_stops
        description: "All scheduled trip stops in the hour, observable or not; the gap to observable_trip_stops is time the pipeline was not capturing."
        data_tests:
          - not_null
      - name: coverage_denominator
        description: "Observable trip stops in the hour (equals observable_trip_stops)."
        data_tests:
          - not_null
      - name: coverage_pct
        description: "100 * coverage_numerator / coverage_denominator. Measures data availability, not service delivery."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: skipped_stop_count
        description: "Covered trip stops whose latest usable snapshot is SKIPPED (a service change observed in the feed)."
        data_tests:
          - not_null
      - name: skipped_share
        description: "skipped_stop_count / observable_trip_stops, a fraction between 0 and 1."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: capture_minutes
        description: "Minutes of the hour with a successful non-duplicate trip_updates capture."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 60
      - name: window_complete
        description: "True when capture_minutes is at least 55."
        data_tests:
          - not_null
  - name: agg_line_reliability_window
    description: "Reliability per line over the last 24 hours before metrics_as_of (the latest hour in agg_line_reliability_hourly), all directions combined. Medians and p90 are exact over eligible predictions, not averages of hourly values."
    config:
      meta:
        grain: "line x window_label"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, window_label]
    columns:
      - name: line
        description: "Reporting line (route_id)."
        data_tests:
          - not_null
      - name: window_label
        description: "Window name; only last_24h."
        data_tests:
          - not_null
      - name: median_predicted_deviation_s
        description: "Exact median predicted minus scheduled arrival in seconds over the window's eligible predictions."
      - name: p90_predicted_deviation_s
        description: "Exact 90th percentile of predicted deviation in seconds."
      - name: median_abs_revision_s
        description: "Exact median absolute revision in seconds over eligible predictions with a prior snapshot."
      - name: n_eligible
        description: "Eligible predictions in the window."
        data_tests:
          - not_null
      - name: implausible_deviation_count
        description: "Sum of hourly implausible_deviation_count over the window."
        data_tests:
          - not_null
      - name: coverage_numerator
        description: "Sum of hourly coverage_numerator over the window."
      - name: coverage_denominator
        description: "Sum of hourly observable_trip_stops over the window."
      - name: coverage_pct
        description: "100 * coverage_numerator / coverage_denominator."
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: skipped_stop_count
        description: "Covered trip stops in the window whose latest usable snapshot is SKIPPED."
      - name: skipped_share
        description: "skipped_stop_count / coverage_denominator, a fraction between 0 and 1."
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  - name: agg_stop_deviation_daily
    description: "Predicted deviation per line, direction, stop and service date, counting only observed hours and observable trip stops."
    config:
      meta:
        grain: "line x direction_id x stop_id x service_date"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, stop_id, service_date]
    columns:
      - name: line
        description: "Reporting line (route_id)."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
        data_tests:
          - not_null
      - name: stop_id
        description: "Stop identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stop')
                field: stop_id
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: stop_sequence
        description: "Median scheduled stop_sequence of the stop within the line and direction, used to order stops along the line."
        data_tests:
          - not_null
      - name: median_predicted_deviation_s
        description: "Median predicted minus scheduled arrival in seconds over eligible predictions."
      - name: n_eligible
        description: "Eligible predictions (one per trip stop)."
        data_tests:
          - not_null
      - name: coverage_numerator
        description: "Scheduled trip stops at the stop in observed hours with a usable observation (SKIPPED counts as covered)."
        data_tests:
          - not_null
      - name: observable_trip_stops
        description: "Observable scheduled trip stops at the stop in observed hours (equals coverage_denominator)."
        data_tests:
          - not_null
      - name: coverage_denominator
        description: "Observable scheduled trip stops at the stop in observed hours."
        data_tests:
          - not_null
      - name: coverage_pct
        description: "100 * coverage_numerator / coverage_denominator."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
  - name: agg_pipeline_health
    description: "One row per ingest run: per-feed capture status, size and duplication, vehicle count and quarantine counts by reason. Records filtered out of scope are not persisted by curation and so are not reported."
    config:
      meta:
        grain: "run_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [run_id]
    columns:
      - name: run_id
        description: "Ingest run identifier."
        data_tests:
          - not_null
      - name: scheduled_at
        description: "UTC time the run was scheduled for."
        data_tests:
          - not_null
      - name: n_captures
        description: "Captures recorded for the run: one per feed at poll 0, plus up to three 15 s vehicle polls."
        data_tests:
          - not_null
      - name: vehicle_polls_ok
        description: "Successful vehicle_positions captures in the run (1 before 15 s sampling, up to 4 after)."
        data_tests:
          - not_null
      - name: vehicle_polls_error
        description: "Failed vehicle_positions captures in the run."
        data_tests:
          - not_null
      - name: duplicate_delivery_count
        description: "Extra deliveries of this run's scheduled minute beyond the first (flagged by ingest, dropped by the capture_id dedupe, or a separate run for the same minute), reported on the earliest kept run of the minute; 0 when the minute was delivered once."
        data_tests:
          - not_null
      - name: trip_updates_status
        description: "Capture status of the trip_updates feed in the run (ok or error)."
      - name: trip_updates_bytes
        description: "Payload bytes of the trip_updates capture."
      - name: trip_updates_entity_count
        description: "Entities in the trip_updates payload."
      - name: trip_updates_is_duplicate
        description: "True when the trip_updates payload equals the previous capture's."
        data_tests:
          - not_null
      - name: vehicle_positions_status
        description: "Capture status of the vehicle_positions feed in the run (ok or error)."
      - name: vehicle_positions_bytes
        description: "Payload bytes of the vehicle_positions capture."
      - name: vehicle_positions_entity_count
        description: "Entities in the vehicle_positions payload."
      - name: vehicle_positions_is_duplicate
        description: "True when the vehicle_positions payload equals the previous capture's."
        data_tests:
          - not_null
      - name: alerts_status
        description: "Capture status of the alerts feed in the run (ok or error)."
      - name: alerts_bytes
        description: "Payload bytes of the alerts capture."
      - name: alerts_entity_count
        description: "Entities in the alerts payload."
      - name: alerts_is_duplicate
        description: "True when the alerts payload equals the previous capture's."
        data_tests:
          - not_null
      - name: subway_vehicle_count
        description: "Distinct vehicles in the run's vehicle_positions capture."
        data_tests:
          - not_null
      - name: quarantine_total
        description: "Records quarantined from the run's captures."
        data_tests:
          - not_null
      - name: quarantine_missing_trip_id
        description: "Quarantined for a missing trip_id."
        data_tests:
          - not_null
      - name: quarantine_invalid_coordinates
        description: "Quarantined for invalid coordinates."
        data_tests:
          - not_null
      - name: quarantine_protobuf_parse_error
        description: "Whole captures quarantined for a protobuf parse error."
        data_tests:
          - not_null
      - name: quarantine_other
        description: "Quarantined for any other reason."
        data_tests:
          - not_null
  - name: agg_quality_checks_hourly
    description: "Hourly data-quality checks (prediction_coverage and schedule_join_coverage consider observable trip stops only) with warn/fail status from the quality_thresholds seed. Values are percentages except missed_runs and duplicate_deliveries (counts per hour; duplicate_deliveries is the number of extra scheduler deliveries). implausible_deviation_share is the percentage of last-snapshot picks more than 3600 s from the schedule. late_event_share counts records fetched more than 300 seconds after their event_ts. vehicle_count_drop compares with the same hour one week earlier and is no_baseline when that hour was not observed."
    config:
      meta:
        grain: "service_date x hour_local x check_name"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, hour_local, check_name]
    columns:
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: check_name
        description: "Name of the check."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [missed_runs, feed_gap_min, duplicate_deliveries, duplicate_share, invalid_coordinate_share, missing_trip_id_share, prediction_coverage, schedule_join_coverage, implausible_deviation_share, late_event_share, vehicle_count_drop]
      - name: value
        description: "Measured value; null when it cannot be computed."
      - name: direction
        description: "above: bad when the value is at or above the thresholds; below: bad when under them."
        data_tests:
          - not_null
      - name: warn_threshold
        description: "Value at which the check warns."
        data_tests:
          - not_null
      - name: fail_threshold
        description: "Value at which the check fails."
        data_tests:
          - not_null
      - name: scheduled_trip_stops
        description: "Scheduled subway trip-stops in the hour (from the timetable); decides no_service."
        data_tests:
          - not_null
      - name: status
        description: "ok, warn, fail, no_baseline, no_data or no_service (the hour has fewer scheduled subway trip-stops than no_service_min_trip_stops; content checks only)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, warn, fail, no_baseline, no_data, no_service]
  - name: agg_quarantine_reasons
    description: "Quarantined records per local date, source table and reason, so Pipeline health can name every reason. Small by construction (days x tables x reasons)."
    config:
      meta:
        grain: "local_date x source_table x reason"
    data_tests:
      - unique_grain:
          arguments:
            columns: [local_date, source_table, reason]
    columns:
      - name: local_date
        description: "Local date of the quarantined capture's scheduled run."
        data_tests:
          - not_null
      - name: source_table
        description: "Curated table the record was bound for."
        data_tests:
          - not_null
      - name: reason
        description: "Quarantine reason as written by curation."
        data_tests:
          - not_null
      - name: n_records
        description: "Quarantined records."
        data_tests:
          - not_null
  - name: agg_arrival_reconstruction_daily
    description: "Arrival reconstruction coverage per service date and line: trip stops by method and confidence, monotonic violations, and observed trips excluded for lack of a shape. Shares are percentages of reconstructed trip stops."
    config:
      meta:
        grain: "service_date x line"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, line]
    columns:
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: trip_stops
        description: "Reconstructed trip stops (rows of fct_reconstructed_arrivals), missing ones included."
        data_tests:
          - not_null
      - name: trips_reconstructed
        description: "Trip instances with at least one reconstructed stop."
      - name: n_segments_created
        description: "Extra runs created because a vehicle's stop sequence went backwards on the same trip id (runs beyond the first of a trip instance)."
      - name: n_observed
        description: "Trip stops reconstructed from an observed interval."
      - name: n_bracketed
        description: "Trip stops reconstructed by interpolation."
      - name: n_missing
        description: "Trip stops on the observed stretch that could not be reconstructed."
      - name: n_high
        description: "Trip stops with high confidence."
      - name: n_medium
        description: "Trip stops with medium confidence."
      - name: n_low
        description: "Trip stops with low confidence."
      - name: share_high
        description: "n_high as a percentage of trip_stops; null without trip stops."
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: share_medium
        description: "n_medium as a percentage of trip_stops."
      - name: share_low
        description: "n_low as a percentage of trip_stops."
      - name: share_missing
        description: "n_missing as a percentage of trip_stops."
      - name: n_monotonic_violations
        description: "Trip stops flagged monotonic_ok = false."
      - name: added_trips_excluded
        description: "ADDED trip instances observed but not reconstructed (no schedule, no shape)."
      - name: unscheduled_trips_excluded
        description: "Observed trip instances not in the schedule for their service date, not reconstructed."
      - name: no_shape_trips_excluded
        description: "Scheduled trip instances without a shape, not reconstructed."
  - name: agg_active_alerts
    description: "Service alerts active per line and hour (an alert counts in the hour when a capture carried it inside its active period). is_service_disruption marks effects DETOUR, NO_SERVICE, REDUCED_SERVICE, SIGNIFICANT_DELAYS, MODIFIED_SERVICE or header text matching shuttle or suspen. scope says what the alert covers: line (the route, or two or more stations of it) or stop (one station); only a line-scope disruption disrupts the line."
    config:
      meta:
        grain: "service_date x hour_local x line x effect x is_service_disruption x scope"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, hour_local, line, effect, is_service_disruption, scope]
    columns:
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23) of the capture."
        data_tests:
          - not_null
      - name: line
        description: "Reporting line (route_id) of the informed entity."
        data_tests:
          - not_null
      - name: effect
        description: "GTFS-realtime alert effect."
        data_tests:
          - not_null
      - name: is_service_disruption
        description: "True when the alert makes the hour a service disruption for the line."
        data_tests:
          - not_null
      - name: scope
        description: "line when an informed entity names the route without a stop or the alert covers two or more stations of the line; stop when it covers one station."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [line, stop]
      - name: n_active_alerts
        description: "Distinct active alerts."
      - name: n_captures
        description: "Distinct captures that carried them."
      - name: n_stops
        description: "Most stations (parent stations) covered by one of these alerts."
      - name: stop_names
        description: "Names of the stations covered, for stop-scope alerts; null for line scope."
  - name: fct_prediction_errors
    description: "Prediction error against the reconstructed arrival: per trip stop and horizon bucket, the last snapshot in the bucket collected at or before the arrival. High and medium arrivals only; outage-hour rows are flagged and left out of the aggregate."
    config:
      meta:
        grain: "trip_instance_key x segment x stop_sequence x horizon_bucket"
    data_tests:
      - unique_grain:
          arguments:
            columns: [trip_instance_key, segment, stop_sequence, horizon_bucket]
    columns:
      - name: trip_instance_key
        description: "Trip instance identifier."
        data_tests:
          - not_null
      - name: segment
        description: "Run of the trip id."
        data_tests:
          - not_null
      - name: stop_sequence
        description: "Position of the stop in the trip."
        data_tests:
          - not_null
      - name: horizon_bucket
        description: "Horizon bucket in minutes: 0-5, 5-10, 10-20 or 20-30, by predicted arrival minus collection time."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0-5', '5-10', '10-20', '20-30']
      - name: service_date
        description: "Service date of the trip instance."
      - name: line
        description: "Reporting line."
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: stop_id
        description: "Stop identifier."
      - name: arrival_service_date
        description: "Service date of the reconstructed arrival time."
      - name: hour_local
        description: "Local hour of the reconstructed arrival."
      - name: capture_id
        description: "Capture of the snapshot."
      - name: collected_at
        description: "When the snapshot was collected."
      - name: horizon_s
        description: "Predicted arrival minus collection time, seconds."
      - name: predicted_arrival_ts
        description: "Predicted arrival (UTC)."
      - name: arrival_ts
        description: "Reconstructed arrival (UTC)."
      - name: confidence
        description: "Confidence of the reconstructed arrival: high or medium."
      - name: error_s
        description: "Predicted minus reconstructed arrival in seconds; positive means the prediction was late."
        data_tests:
          - not_null
      - name: abs_error_s
        description: "Absolute error in seconds."
      - name: data_outage
        description: "Data-outage flag of the arrival hour."
      - name: service_disruption
        description: "Service-disruption label of the arrival hour."
  - name: agg_prediction_accuracy_daily
    description: "Prediction accuracy per line, service date, horizon bucket and service-disruption label: median absolute error, MAE and the share within 60 and 120 seconds of the reconstructed arrival, with coverage. Outage hours are excluded and counted."
    config:
      meta:
        grain: "line x service_date x horizon_bucket x service_disruption"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, service_date, horizon_bucket, service_disruption]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: horizon_bucket
        description: "Horizon bucket in minutes: 0-5, 5-10, 10-20 or 20-30."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0-5', '5-10', '10-20', '20-30']
      - name: service_disruption
        description: "True for trip stops whose arrival hour had a service-disruption alert on the line."
        data_tests:
          - not_null
      - name: n
        description: "Trip stops (errors) behind the statistics."
        data_tests:
          - not_null
      - name: n_excluded_outage
        description: "Errors left out because the arrival hour was a data outage."
      - name: median_abs_error_s
        description: "Median absolute error in seconds."
      - name: mae_s
        description: "Mean absolute error in seconds."
      - name: pct_within_60s
        description: "Percentage of errors within 60 seconds."
      - name: pct_within_120s
        description: "Percentage of errors within 120 seconds."
      - name: coverage_numerator
        description: "Numerator of coverage."
      - name: coverage_denominator
        description: "Denominator of coverage."
      - name: coverage_pct
        description: "Coverage as a percentage (0-100); null when the denominator is zero or the hour is an outage."
  - name: agg_actual_deviation_hourly
    description: "Actual deviation from the timetable per line, direction, service date and scheduled hour: median, p90 and the share within -1 and +5 minutes, from high and medium reconstructed arrivals. Rows exist for hours inside the vehicle_positions window; outage hours keep a row with empty statistics."
    config:
      meta:
        grain: "line x direction_id x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23) of the scheduled arrival."
        data_tests:
          - not_null
      - name: data_outage
        description: "True when the hour is a data outage; statistics are empty."
        data_tests:
          - not_null
      - name: service_disruption
        description: "True when the line had an active service-disruption alert in the hour."
        data_tests:
          - not_null
      - name: n_arrivals
        description: "Arrivals behind the statistics."
        data_tests:
          - not_null
      - name: n_excluded_outage
        description: "Arrivals left out because the hour is an outage."
      - name: n_implausible
        description: "Arrivals more than 3600 seconds from the schedule, left out of the statistics."
      - name: n_stop_excluded
        description: "Scheduled trip stops left out of the coverage because their station is under a stop-level service-disruption alert in the hour."
      - name: median_deviation_s
        description: "Median of arrival minus scheduled arrival, seconds."
      - name: p90_deviation_s
        description: "90th percentile of the deviation, seconds."
      - name: pct_on_time_window
        description: "Percentage of arrivals from 60 seconds early to 300 seconds late."
      - name: scheduled_trip_stops
        description: "Scheduled trip stops of the line, direction and hour."
      - name: coverage_numerator
        description: "Numerator of coverage."
      - name: coverage_denominator
        description: "Denominator of coverage."
      - name: coverage_pct
        description: "Coverage as a percentage (0-100); null when the denominator is zero or the hour is an outage."
  - name: fct_headways
    description: "One row per candidate headway at a stop: a high or medium train B and the high or medium train A before it. status is valid, or the reason the pair is dropped: train_between, unproven_order, no_scheduled_headway, implausible."
    config:
      meta:
        grain: "line x direction_id x service_date x stop_id x stop_sequence x to_trip_instance_key x to_segment"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, stop_id, stop_sequence, to_trip_instance_key, to_segment]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
