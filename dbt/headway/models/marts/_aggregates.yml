  - name: agg_weather_comparison
    description: "On-time and headway-within-band shares on snow, heavy-rain and extreme-heat days against the other days of the same window, with seeded bootstrap 95 % intervals over days (Release 3, ADR-022). Descriptive only: it compares groups of days and never says the weather caused a difference. Withheld when either group has fewer than 5 days. Exported with the R3 gold tables."
