          - {line: "Red", direction_id: 0, service_date: "2026-11-22", segment: 0, trip_instance_key: "B", stop_sequence: 2, stop_id: "s2", arrival_ts: "2026-11-22 14:05:00+00", confidence: "high", known_at: "2026-11-22 14:06:00+00"}
