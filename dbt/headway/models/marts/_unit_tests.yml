    description: >-
      Service date 2026-11-22 (starts 08:00 UTC), measured to 08:04, so five minutes. In four of
      them poll 0 of all three feeds was captured; in 08:02 the alerts capture is missing, and an
      errored capture does not count. 4 of 5 is 80 % against 99 %: not met, and the day spent 20
      times its error budget. Arrival coverage counts Red (40 of 50) and leaves the outage hour
      out; Blue is under a service disruption and is reported on its own (10 of 20) without
      counting toward the objective. Nothing was exported, so freshness has no hours and
      transform_success no slots.
