  - name: countdown_outcomes_miss_versus_unknown
    config:
      tags: [r2]
    description: >-
      Six countdowns. T1 stop 1 arrived 50 s before the prediction (hit at 60 s; a second run of the
      trip id arriving later is ignored) and T1 stop 2 90 s before it (hit at 120 s only). T2 was
      marked SKIPPED in the feed after the countdown: a confirmed non-arrival, a miss. T3 was left
      by its vehicle at stop 2, for another trip, before stop 3: a confirmed non-arrival, a miss.
      T4 was also left for another trip but its vehicle had reached stop 3: no arrival and no
      confirmation, unknown. T5 has only a SKIPPED row from a duplicate capture, which does not
      count: unknown.
