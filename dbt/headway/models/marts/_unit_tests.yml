  - name: service_disruptions_line_scope_with_ends_and_segments
    config:
      tags: [r4]
    description: >-
      Red has segments s1-s2 and s2-s3 (direction 0) and s3-s2 (direction 1). Alert a1 (line scope,
      SIGNIFICANT_DELAYS, seen in hours 8 and 9) covers stations Beta and Gamma: it is active in the
      latest hour of the window, runs from Beta to Gamma and affects all three segments (the first
      ends at Beta). The header text of its latest sighting is kept. Alert a2 is a stop-scope alert
      and alert a3 a line-scope alert that is not a service disruption: both are left out. Alert a4
      was last active in hour 8 only: not active.
    model: agg_service_disruptions
    given:
      - input: ref('int_window_hours')
        rows:
          - {window_label: last_24h, service_date: "2026-11-22", hour_local: 8, hour_start: "2026-11-22 13:00:00+00"}
          - {window_label: last_24h, service_date: "2026-11-22", hour_local: 9, hour_start: "2026-11-22 14:00:00+00"}
          - {window_label: last_7d, service_date: "2026-11-21", hour_local: 9, hour_start: "2026-11-21 14:00:00+00"}
      - input: ref('int_stop_stations')
        rows:
          - {stop_id: s1, station_id: place-a, station_name: Alpha}
          - {stop_id: s2, station_id: place-b, station_name: Beta}
          - {stop_id: s3, station_id: place-c, station_name: Gamma}
      - input: ref('agg_headway_segment_window')
        rows:
          - {line: Red, direction_id: 0, from_stop_id: s1, to_stop_id: s2, window_label: last_24h, segment_order: 1}
          - {line: Red, direction_id: 0, from_stop_id: s2, to_stop_id: s3, window_label: last_24h, segment_order: 2}
          - {line: Red, direction_id: 1, from_stop_id: s3, to_stop_id: s2, window_label: last_24h, segment_order: 1}
          - {line: Red, direction_id: 0, from_stop_id: s1, to_stop_id: s2, window_label: last_7d, segment_order: 1}
      - input: ref('int_alert_scopes')
        rows:
          - {line: Red, service_date: "2026-11-22", hour_local: 8, alert_id: a1, effect: SIGNIFICANT_DELAYS, header_text: "Delays of 20 minutes", first_seen: "2026-11-22 13:05:00+00", last_seen: "2026-11-22 13:55:00+00", scope: line, is_service_disruption: true, station_ids: ["place-b", "place-c"]}
          - {line: Red, service_date: "2026-11-22", hour_local: 9, alert_id: a1, effect: SIGNIFICANT_DELAYS, header_text: "Shuttle buses replace trains", first_seen: "2026-11-22 14:00:00+00", last_seen: "2026-11-22 14:50:00+00", scope: line, is_service_disruption: true, station_ids: ["place-c", "place-b"]}
          - {line: Red, service_date: "2026-11-22", hour_local: 9, alert_id: a2, effect: STOP_CLOSURE, header_text: "Closed", first_seen: "2026-11-22 14:00:00+00", last_seen: "2026-11-22 14:50:00+00", scope: stop, is_service_disruption: true, station_ids: ["place-a"]}
          - {line: Red, service_date: "2026-11-22", hour_local: 9, alert_id: a3, effect: ACCESSIBILITY_ISSUE, header_text: "Elevator", first_seen: "2026-11-22 14:00:00+00", last_seen: "2026-11-22 14:50:00+00", scope: line, is_service_disruption: false, station_ids: ["place-a"]}
          - {line: Red, service_date: "2026-11-22", hour_local: 8, alert_id: a4, effect: DETOUR, header_text: "Detour", first_seen: "2026-11-22 13:00:00+00", last_seen: "2026-11-22 13:10:00+00", scope: line, is_service_disruption: true, station_ids: ["place-a"]}
    expect:
