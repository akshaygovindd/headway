  - name: accuracy_window_is_exact_not_an_average_of_daily_medians
    config:
      tags: [r2]
    description: >-
      Red, bucket 0-5, last_7d. Day 1 has three absolute errors of 10 s, day 2 has 100 s and 200 s
      (one of them in a disrupted hour), and one more error sits in an outage hour. Over all five
      errors the median is 10 s, the p90 160 s, the mean 66 s; an n-weighted mean of the daily
      medians (10 and 150) would give 66 s for the median. Coverage: 5 of 7 scheduled trip stops
      (the two scheduled in the outage hour are not in the denominator).
    model: agg_accuracy_window
    given:
      - input: ref('int_window_hours')
        rows:
          - {window_label: last_7d, service_date: "2026-11-22", hour_local: 8}
          - {window_label: last_7d, service_date: "2026-11-23", hour_local: 8}
          - {window_label: last_7d, service_date: "2026-11-23", hour_local: 9}
      - input: ref('fct_prediction_errors')
        rows:
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-22", hour_local: 8, abs_error_s: 10.0, data_outage: false, service_disruption: false}
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-22", hour_local: 8, abs_error_s: 10.0, data_outage: false, service_disruption: false}
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-22", hour_local: 8, abs_error_s: 10.0, data_outage: false, service_disruption: false}
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-23", hour_local: 8, abs_error_s: 100.0, data_outage: false, service_disruption: false}
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-23", hour_local: 8, abs_error_s: 200.0, data_outage: false, service_disruption: true}
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-23", hour_local: 9, abs_error_s: 500.0, data_outage: true, service_disruption: false}
          # outside the window
          - {line: Red, horizon_bucket: "0-5", arrival_service_date: "2026-11-01", hour_local: 8, abs_error_s: 900.0, data_outage: false, service_disruption: false}
      - input: ref('int_scheduled_stop_times')
        rows:
          - {line: Red, service_date: "2026-11-22", hour_local: 8}
          - {line: Red, service_date: "2026-11-22", hour_local: 8}
          - {line: Red, service_date: "2026-11-22", hour_local: 8}
          - {line: Red, service_date: "2026-11-22", hour_local: 8}
          - {line: Red, service_date: "2026-11-23", hour_local: 8}
          - {line: Red, service_date: "2026-11-23", hour_local: 8}
          - {line: Red, service_date: "2026-11-23", hour_local: 8}
          - {line: Red, service_date: "2026-11-23", hour_local: 9}
          - {line: Red, service_date: "2026-11-23", hour_local: 9}
      - input: ref('int_hour_flags')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, data_outage: false}
          - {service_date: "2026-11-23", hour_local: 8, data_outage: false}
          - {service_date: "2026-11-23", hour_local: 9, data_outage: true}
    expect:
      rows:
        - {line: Red, window_label: last_7d, horizon_bucket: "0-5", n: 5, n_excluded_outage: 1, n_disruption: 1, median_abs_error_s: 10.0, p90_abs_error_s: 160.0, mae_s: 66.0, pct_within_60s: 60.0, pct_within_120s: 80.0, coverage_numerator: 5, coverage_denominator: 7}

