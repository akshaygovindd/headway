        - {line: Red, alert_id: a4, effect: DETOUR, header_text: Detour, first_seen: "2026-11-22 13:00:00+00", last_seen: "2026-11-22 13:10:00+00", is_active: false, n_stations: 1, from_station_name: Alpha, to_station_name: Alpha, segment_keys: ["0:s1:s2"]}

  - name: reconstructed_arrivals_bracketed_stops_are_moved_earlier_by_their_share_of_the_missed_dwell
    config:
      tags: [r2]
    description: >-
      Trip R1 is seen at 0 m (13:00:00) and 2000 m (13:01:00), 60 s apart, so the run's spacing
      class is 60. Stops at 1000, 1500 and 1800 m are bracketed; interpolated 13:00:30, 13:00:45
      and 13:00:54, a share 0.5, 0.75 and 0.9 of the way along. Stop 1 has only the line row
      (missed dwell 20 s): moved 0.5 x 20 = 10 s, to 13:00:20. Stop 2 has a stop row (20 s) that
      is used over the line row: 0.75 x 20 = 15 s, to 13:00:30. Stop 3 has a stop_hour row for the am bucket (20 s, 8 am local) and one
      for pm (100 s) that must not be used: 0.9 x 20 = 18 s, to 13:00:36.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('reconstruction_dwell')
        rows:
          - {level: line, line: Red, stop_id: null, hour_bucket: null, missed_t60_s: 20, missed_t120_s: 1}
          - {level: stop, line: Red, stop_id: r2, hour_bucket: null, missed_t60_s: 20, missed_t120_s: 1}
          - {level: stop_hour, line: Red, stop_id: r3, hour_bucket: am, missed_t60_s: 20, missed_t120_s: 1}
          - {level: stop_hour, line: Red, stop_id: r3, hour_bucket: pm, missed_t60_s: 100, missed_t120_s: 100}
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 1, stop_id: r1, line: Red, dist_m: 1000, scheduled_arrival_ts: "2026-11-22 13:00:30+00"}
          - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 2, stop_id: r2, line: Red, dist_m: 1500, scheduled_arrival_ts: "2026-11-22 13:00:40+00"}
          - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 3, stop_id: r3, line: Red, dist_m: 1800, scheduled_arrival_ts: "2026-11-22 13:00:50+00"}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: vr1, segment: 0, trip_instance_key: "R1|2026-11-22|08:00:00", capture_id: c1, event_ts: "2026-11-22 13:00:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: vr1, segment: 0, trip_instance_key: "R1|2026-11-22|08:00:00", capture_id: c2, event_ts: "2026-11-22 13:01:00+00", dist_m: 2000, current_status: IN_TRANSIT_TO, current_stop_sequence: 4}
    expect:
      rows:
        - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 1, method: bracketed, arrival_ts: "2026-11-22 13:00:20+00", monotonic_ok: true}
        - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 2, method: bracketed, arrival_ts: "2026-11-22 13:00:30+00", monotonic_ok: true}
        - {trip_instance_key: "R1|2026-11-22|08:00:00", stop_sequence: 3, method: bracketed, arrival_ts: "2026-11-22 13:00:36+00", monotonic_ok: true}

  - name: reconstructed_arrivals_dwell_correction_reads_the_column_of_the_runs_spacing
    config:
      tags: [r2]
    description: >-
      Trip R2 is seen at 0 m (13:00:00) and 2000 m (13:01:00): 60 s apart, spacing class 60. The
      stop at 1000 m is interpolated to 13:00:30, share 0.5; the line row has 8 s in the 60 s
      column and 200 s in the 120 s column, so the stop moves 0.5 x 8 = 4 s, to 13:00:26. Trip R5
      is seen 150 s apart (class 120, the 90 s or more column): 0.5 x 40 = 20 s earlier than its
      interpolated 13:01:15, which is 13:00:55.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('reconstruction_dwell')
        rows:
          - {level: line, line: Red, stop_id: null, hour_bucket: null, missed_t60_s: 8, missed_t120_s: 40}
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "R2|2026-11-22|08:00:00", stop_sequence: 1, stop_id: r1, line: Red, dist_m: 1000, scheduled_arrival_ts: "2026-11-22 13:00:30+00"}
          - {trip_instance_key: "R5|2026-11-22|08:00:00", stop_sequence: 1, stop_id: r1, line: Red, dist_m: 1000, scheduled_arrival_ts: "2026-11-22 13:01:15+00"}
      - input: ref('int_vehicle_stop_events')
