  - name: marey_keeps_only_the_last_complete_hour_and_maps_methods
    config:
      tags: [r4]
    description: >-
      The latest hour of the export starts at 14:00 UTC (hour 9 local), so the last complete hour is
      13:00 to 14:00. An observed arrival at 13:20 stays as observed, a bracketed one at 13:40
      becomes estimated; a missing stop, an arrival at 14:05 (the running hour) and one at 12:50
      (the hour before) are left out.
    model: agg_marey_last_hour
    given:
      - input: ref('int_window_hours')
        rows:
          - {window_label: last_24h, service_date: "2026-11-22", hour_local: 8, hour_start: "2026-11-22 13:00:00+00"}
          - {window_label: last_24h, service_date: "2026-11-22", hour_local: 9, hour_start: "2026-11-22 14:00:00+00"}
      - input: ref('dim_stop')
        rows:
          - {stop_id: s1, stop_name: Alpha}
          - {stop_id: s2, stop_name: Beta}
      - input: ref('fct_reconstructed_arrivals')
        rows:
          - {line: Red, direction_id: 0, trip_instance_key: A, segment: 0, trip_id: A, stop_id: s1, stop_sequence: 1, arrival_ts: "2026-11-22 13:20:00+00", method: observed, confidence: high, scheduled_arrival_ts: "2026-11-22 13:19:00+00"}
