      the same bucket the one closest to the centre is kept: 75 s beats 40 s (1 min), 180 s beats
      210 s (3 min), 290 s beats 330 s (5 min). 25 s, 91 s, 211 s and 640 s fall in no bucket. A
      duplicate capture (62 s), a SKIPPED row (61 s) and a snapshot not matched to the schedule
