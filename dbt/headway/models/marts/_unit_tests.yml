version: 2

# Synthetic trips with known true arrivals. Times are UTC on 2026-11-22 (08:00 local).
unit_tests:
  - name: reconstructed_arrivals_known_trip
    config:
      tags: [r2]
    description: >-
      Trip T1 with stops at 0, 1000, 2000, 3000 and 4000 m. Stop 1: the first observation is
      already STOPPED_AT, so there is no interval (missing). Stop 2: observed, previous capture
      13:01:40, first STOPPED_AT 13:02:00 (a second STOPPED_AT at 13:02:30 is ignored), true
      arrival 13:01:50, width 20 s, high. Stops 3 and 4: never stopped at, bracketed between the
      13:03:20 (1800 m) and 13:05:20 (3400 m) observations, 120 s apart: 2000 m is 1/8 of the
      way (13:03:35), 3000 m is 3/4 (13:04:50), medium. Stop 5: observed with a 40 s interval,
      13:05:20 to 13:06:00, midpoint 13:05:40, medium.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 1, stop_id: s1, dist_m: 0}
          - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 2, stop_id: s2, dist_m: 1000}
          - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 3, stop_id: s3, dist_m: 2000}
          - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 4, stop_id: s4, dist_m: 3000}
          - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 5, stop_id: s5, dist_m: 4000}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c1, event_ts: "2026-11-22 13:00:00+00", dist_m: 0, current_status: STOPPED_AT, current_stop_sequence: 1}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c2, event_ts: "2026-11-22 13:01:40+00", dist_m: 700, current_status: IN_TRANSIT_TO, current_stop_sequence: 2}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c3, event_ts: "2026-11-22 13:02:00+00", dist_m: 1000, current_status: STOPPED_AT, current_stop_sequence: 2}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c4, event_ts: "2026-11-22 13:02:30+00", dist_m: 1000, current_status: STOPPED_AT, current_stop_sequence: 2}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c5, event_ts: "2026-11-22 13:03:20+00", dist_m: 1800, current_status: IN_TRANSIT_TO, current_stop_sequence: 3}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c6, event_ts: "2026-11-22 13:05:20+00", dist_m: 3400, current_status: IN_TRANSIT_TO, current_stop_sequence: 5}
          - {vehicle_id: v1, segment: 0, trip_instance_key: "T1|2026-11-22|08:00:00", capture_id: c7, event_ts: "2026-11-22 13:06:00+00", dist_m: 4000, current_status: STOPPED_AT, current_stop_sequence: 5}
          # an observation the model must not use
          - {vehicle_id: v9, segment: 0, trip_instance_key: "ADDED-1|2026-11-22|", capture_id: c8, event_ts: "2026-11-22 13:00:30+00", dist_m: null, exclusion_reason: added_trip}
    expect:
      rows:
        - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 1, method: missing, confidence: null, arrival_ts: null, interval_width_s: null, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 2, method: observed, confidence: high, arrival_ts: "2026-11-22 13:01:50+00", interval_width_s: 20, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 3, method: bracketed, confidence: medium, arrival_ts: "2026-11-22 13:03:35+00", interval_width_s: null, bracket_gap_s: 120, monotonic_ok: true}
        - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 4, method: bracketed, confidence: medium, arrival_ts: "2026-11-22 13:04:50+00", interval_width_s: null, bracket_gap_s: 120, monotonic_ok: true}
        - {trip_instance_key: "T1|2026-11-22|08:00:00", stop_sequence: 5, method: observed, confidence: medium, arrival_ts: "2026-11-22 13:05:40+00", interval_width_s: 40, bracket_gap_s: null, monotonic_ok: true}

  - name: reconstructed_arrivals_confidence_bands
    config:
      tags: [r2]
    description: >-
      Observed interval widths of 30 s, 31 s and 120 s, 121 s sit on the band edges (high, medium,
      medium, low); a bracket gap of 121 s is low.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 1, stop_id: s1, dist_m: 0}
          - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 2, stop_id: s2, dist_m: 1000}
          - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 3, stop_id: s3, dist_m: 2000}
          - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 4, stop_id: s4, dist_m: 3000}
          - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 5, stop_id: s5, dist_m: 3500}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d1, event_ts: "2026-11-22 14:00:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d2, event_ts: "2026-11-22 14:00:30+00", dist_m: 0, current_status: STOPPED_AT, current_stop_sequence: 1}
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d3, event_ts: "2026-11-22 14:01:01+00", dist_m: 1000, current_status: STOPPED_AT, current_stop_sequence: 2}
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d4, event_ts: "2026-11-22 14:03:01+00", dist_m: 2000, current_status: STOPPED_AT, current_stop_sequence: 3}
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d5, event_ts: "2026-11-22 14:05:02+00", dist_m: 3000, current_status: STOPPED_AT, current_stop_sequence: 4}
          - {vehicle_id: v2, segment: 0, trip_instance_key: "T2|2026-11-22|08:00:00", capture_id: d6, event_ts: "2026-11-22 14:07:03+00", dist_m: 4000, current_status: IN_TRANSIT_TO, current_stop_sequence: 6}
    expect:
      rows:
        - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 1, method: observed, confidence: high, arrival_ts: "2026-11-22 14:00:15+00", interval_width_s: 30, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 2, method: observed, confidence: medium, arrival_ts: "2026-11-22 14:00:45.5+00", interval_width_s: 31, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 3, method: observed, confidence: medium, arrival_ts: "2026-11-22 14:02:01+00", interval_width_s: 120, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 4, method: observed, confidence: low, arrival_ts: "2026-11-22 14:04:01.5+00", interval_width_s: 121, bracket_gap_s: null, monotonic_ok: true}
        - {trip_instance_key: "T2|2026-11-22|08:00:00", stop_sequence: 5, method: bracketed, confidence: low, arrival_ts: "2026-11-22 14:06:02.5+00", interval_width_s: null, bracket_gap_s: 121, monotonic_ok: true}

  - name: reconstructed_arrivals_stop_projected_behind_its_predecessor
    config:
      tags: [r2]
    description: >-
      Stop 2 is projected before stop 1 on the shape (900 m against 1000 m). Its distance is lifted
      to its predecessor's, so its bracketed arrival equals stop 1's (40 s) instead of coming
      earlier (36 s); stop 3 follows. Every row is monotonic.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 1, stop_id: s1, dist_m: 1000}
          - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 2, stop_id: s2, dist_m: 900}
          - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 3, stop_id: s3, dist_m: 1400}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: v3, segment: 0, trip_instance_key: "T3|2026-11-22|08:00:00", capture_id: e1, event_ts: "2026-11-22 15:00:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: v3, segment: 0, trip_instance_key: "T3|2026-11-22|08:00:00", capture_id: e2, event_ts: "2026-11-22 15:01:00+00", dist_m: 1500, current_status: IN_TRANSIT_TO, current_stop_sequence: 3}
    expect:
      rows:
        - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 1, method: bracketed, confidence: medium, arrival_ts: "2026-11-22 15:00:40+00", bracket_gap_s: 60, monotonic_ok: true}
        - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 2, method: bracketed, confidence: medium, arrival_ts: "2026-11-22 15:00:40+00", bracket_gap_s: 60, monotonic_ok: true}
        - {trip_instance_key: "T3|2026-11-22|08:00:00", stop_sequence: 3, method: bracketed, confidence: medium, arrival_ts: "2026-11-22 15:00:56+00", bracket_gap_s: 60, monotonic_ok: true}

  - name: reconstructed_arrivals_bracketed_stop_follows_an_observed_stop_with_a_dwell
    config:
      tags: [r2]
    description: >-
      Stop 2 (1000 m) is observed: previous capture 13:01:00 (800 m), first STOPPED_AT 13:01:40,
      midpoint 13:01:20. The vehicle is seen at 1050 m at 13:03:00 after a dwell and reaches
      2000 m at 13:04:00. Stop 3 (1500 m) is bracketed between the 1050 m raw observation
      (13:03:00) and the 2000 m one (13:04:00): 13:03:28.4, which is after stop 2's arrival. Stop 1
      (500 m) sits between the 0 m and 800 m observations: 13:00:37.5 on its own interpolation.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 1, stop_id: s1, dist_m: 500}
          - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 2, stop_id: s2, dist_m: 1000}
          - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 3, stop_id: s3, dist_m: 1500}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: v4, segment: 0, trip_instance_key: "T4|2026-11-22|08:00:00", capture_id: f1, event_ts: "2026-11-22 13:00:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: v4, segment: 0, trip_instance_key: "T4|2026-11-22|08:00:00", capture_id: f2, event_ts: "2026-11-22 13:01:00+00", dist_m: 800, current_status: IN_TRANSIT_TO, current_stop_sequence: 2}
          - {vehicle_id: v4, segment: 0, trip_instance_key: "T4|2026-11-22|08:00:00", capture_id: f3, event_ts: "2026-11-22 13:01:40+00", dist_m: 1000, current_status: STOPPED_AT, current_stop_sequence: 2}
          - {vehicle_id: v4, segment: 0, trip_instance_key: "T4|2026-11-22|08:00:00", capture_id: f4, event_ts: "2026-11-22 13:03:00+00", dist_m: 1050, current_status: IN_TRANSIT_TO, current_stop_sequence: 3}
          - {vehicle_id: v4, segment: 0, trip_instance_key: "T4|2026-11-22|08:00:00", capture_id: f5, event_ts: "2026-11-22 13:04:00+00", dist_m: 2000, current_status: IN_TRANSIT_TO, current_stop_sequence: 4}
    expect:
      rows:
        - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 1, method: bracketed, arrival_ts: "2026-11-22 13:00:37.5+00", monotonic_ok: true}
        - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 2, method: observed, arrival_ts: "2026-11-22 13:01:20+00", monotonic_ok: true}
        - {trip_instance_key: "T4|2026-11-22|08:00:00", stop_sequence: 3, method: bracketed, arrival_ts: "2026-11-22 13:03:28.421053+00", monotonic_ok: true}

  - name: reconstructed_arrivals_reused_trip_id_makes_a_second_segment
    config:
      tags: [r2]
    description: >-
      One vehicle runs trip T5 (stops at 0, 1000, 2000 m) and then runs the same trip id again: its
      stop sequence goes 3 then back to 1. The second run is segment 1 with its own observations,
      so its stop 1 arrives at 13:30:20 and there is no backward jump in either run; neither run
      is flagged. Run 0 reaches stop 3 at 13:08:20.
    model: fct_reconstructed_arrivals
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T5|2026-11-22|08:00:00", stop_sequence: 1, stop_id: s1, dist_m: 0}
          - {trip_instance_key: "T5|2026-11-22|08:00:00", stop_sequence: 2, stop_id: s2, dist_m: 1000}
          - {trip_instance_key: "T5|2026-11-22|08:00:00", stop_sequence: 3, stop_id: s3, dist_m: 2000}
      - input: ref('int_vehicle_stop_events')
        rows:
          - {vehicle_id: v5, segment: 0, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g1, event_ts: "2026-11-22 13:00:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: v5, segment: 0, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g2, event_ts: "2026-11-22 13:04:00+00", dist_m: 1000, current_status: STOPPED_AT, current_stop_sequence: 2}
          - {vehicle_id: v5, segment: 0, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g3, event_ts: "2026-11-22 13:08:00+00", dist_m: 2000, current_status: IN_TRANSIT_TO, current_stop_sequence: 3}
          - {vehicle_id: v5, segment: 1, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g4, event_ts: "2026-11-22 13:30:00+00", dist_m: 0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1}
          - {vehicle_id: v5, segment: 1, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g5, event_ts: "2026-11-22 13:30:40+00", dist_m: 0, current_status: STOPPED_AT, current_stop_sequence: 1}
          - {vehicle_id: v5, segment: 1, trip_instance_key: "T5|2026-11-22|08:00:00", capture_id: g6, event_ts: "2026-11-22 13:34:00+00", dist_m: 1000, current_status: IN_TRANSIT_TO, current_stop_sequence: 2}
    expect:
      rows:
        - {trip_instance_key: "T5|2026-11-22|08:00:00", segment: 0, stop_sequence: 1, method: missing, arrival_ts: null, monotonic_ok: true}
        - {trip_instance_key: "T5|2026-11-22|08:00:00", segment: 0, stop_sequence: 2, method: observed, arrival_ts: "2026-11-22 13:02:00+00", monotonic_ok: true}
        - {trip_instance_key: "T5|2026-11-22|08:00:00", segment: 0, stop_sequence: 3, method: bracketed, arrival_ts: "2026-11-22 13:08:00+00", monotonic_ok: true}
        - {trip_instance_key: "T5|2026-11-22|08:00:00", segment: 1, stop_sequence: 1, method: observed, arrival_ts: "2026-11-22 13:30:20+00", monotonic_ok: true}
        - {trip_instance_key: "T5|2026-11-22|08:00:00", segment: 1, stop_sequence: 2, method: bracketed, arrival_ts: "2026-11-22 13:34:00+00", monotonic_ok: true}

  - name: active_alerts_disruption_rules
    config:
      tags: [r2]
    description: >-
      Alert scopes of one hour. Red DETOUR and Orange DETOUR cover the line; a Green-E NO_SERVICE
      (a closed station) is stop scope, so it is reported but does not disrupt the line.
      ACCESSIBILITY_ISSUE never counts as a disruption whatever its scope. The two Red alerts with
      the same effect merge into one row with two alerts.
    model: agg_active_alerts
    given:
      - input: ref('int_alert_scopes')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, line: "Red", alert_id: "a1", effect: "DETOUR", is_service_disruption: true, route_level: false, n_stops: 3, stop_names: "Davis, Porter", capture_ids: ["c1", "c2"], scope: "line"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Red", alert_id: "a2", effect: "DETOUR", is_service_disruption: true, route_level: true, n_stops: 0, stop_names: null, capture_ids: ["c1"], scope: "line"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Red", alert_id: "a3", effect: "ACCESSIBILITY_ISSUE", is_service_disruption: false, route_level: false, n_stops: 1, stop_names: "Davis", capture_ids: ["c1"], scope: "stop"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Green-E", alert_id: "a4", effect: "NO_SERVICE", is_service_disruption: true, route_level: false, n_stops: 1, stop_names: "Symphony", capture_ids: ["c1"], scope: "stop"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Orange", alert_id: "a5", effect: "DETOUR", is_service_disruption: true, route_level: true, n_stops: 0, stop_names: null, capture_ids: ["c1"], scope: "line"}
    expect:
      rows:
        - {service_date: "2026-11-22", hour_local: 8, line: "Red", effect: "DETOUR", is_service_disruption: true, scope: "line", n_active_alerts: 2, n_captures: 2, n_stops: 3, stop_names: null}
        - {service_date: "2026-11-22", hour_local: 8, line: "Red", effect: "ACCESSIBILITY_ISSUE", is_service_disruption: false, scope: "stop", n_active_alerts: 1, n_captures: 1, n_stops: 1, stop_names: "Davis"}
        - {service_date: "2026-11-22", hour_local: 8, line: "Green-E", effect: "NO_SERVICE", is_service_disruption: true, scope: "stop", n_active_alerts: 1, n_captures: 1, n_stops: 1, stop_names: "Symphony"}
        - {service_date: "2026-11-22", hour_local: 8, line: "Orange", effect: "DETOUR", is_service_disruption: true, scope: "line", n_active_alerts: 1, n_captures: 1, n_stops: 0, stop_names: null}

  - name: disrupted_line_hours_count_line_scope_only
    config:
      tags: [r2]
    description: >-
      Red has a line-scope disruption and is disrupted. Green-E has only a stop-scope disruption
      (a closed station) and Blue only a line-scope alert that is not a disruption: neither is a
      disrupted line hour.
    model: int_disrupted_line_hours
    given:
      - input: ref('agg_active_alerts')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, line: "Red", effect: "DETOUR", is_service_disruption: true, scope: "line"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Green-E", effect: "NO_SERVICE", is_service_disruption: true, scope: "stop"}
          - {service_date: "2026-11-22", hour_local: 8, line: "Blue", effect: "ACCESSIBILITY_ISSUE", is_service_disruption: false, scope: "line"}
    expect:
      rows:
        - {line: "Red", service_date: "2026-11-22", hour_local: 8}

  - name: actual_deviation_leaves_out_flagged_station_trip_stops
    config:
      tags: [r2]
    description: >-
      Green-E, hour 9: four scheduled trip stops, two of them at Symphony (platform 70242, parent
      place-symph) which is closed in that hour. The line is not disrupted. Those two trip stops
      and the arrival recorded at Symphony are left out and counted in n_stop_excluded; coverage is
      the one arrival at the other stations over their two scheduled trip stops.
    model: agg_actual_deviation_hourly
    given:
      - input: ref('int_scheduled_stop_times')
        rows:
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", hour_local: 9, stop_id: "70242"}
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", hour_local: 9, stop_id: "place-symph"}
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", hour_local: 9, stop_id: "70240"}
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", hour_local: 9, stop_id: "70244"}
      - input: ref('int_usable_arrivals')
        rows:
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", sched_hour_local: 9, stop_id: "70242", deviation_s: 10, is_nearest_segment: true}
          - {line: "Green-E", direction_id: 0, service_date: "2026-11-22", sched_hour_local: 9, stop_id: "70240", deviation_s: 20, is_nearest_segment: true}
      - input: ref('dim_stop')
        rows:
          - {stop_id: "place-symph", parent_station: null}
          - {stop_id: "70242", parent_station: "place-symph"}
          - {stop_id: "70240", parent_station: "place-prmnl"}
          - {stop_id: "70244", parent_station: "place-nuniv"}
      - input: ref('int_stop_alert_flags')
        rows:
          - {line: "Green-E", service_date: "2026-11-22", hour_local: 9, station_id: "place-symph"}
      - input: ref('int_hour_flags')
        rows:
          - {service_date: "2026-11-22", hour_local: 9, data_outage: false}
      - input: ref('int_disrupted_line_hours')
        rows:
          - {line: "Blue", service_date: "2026-11-22", hour_local: 9}
    expect:
      rows:
