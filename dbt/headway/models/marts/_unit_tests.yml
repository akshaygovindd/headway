  - name: headway_known_at_includes_the_proof_arrivals
    config:
      tags: [r3]
    description: >-
      A and B reach s2 at 14:00 and 14:05 (known 14:01 and 14:06). The only neighbouring stop with
      both is s1, where A's arrival (13:59) is known only at 14:30. The pair is proven by that
      arrival, so the headway is not known before 14:30; the old rule said 14:06 and a forecast at
      14:10 would have used a proof it could not have had.
