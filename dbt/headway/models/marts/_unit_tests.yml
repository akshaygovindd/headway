          - {line: Red, direction_id: 0, trip_instance_key: B, segment: 0, trip_id: B, stop_id: s1, stop_sequence: 1, arrival_ts: "2026-11-22 14:05:00+00", method: observed, confidence: high, scheduled_arrival_ts: "2026-11-22 14:05:00+00"}
          - {line: Red, direction_id: 0, trip_instance_key: C, segment: 0, trip_id: C, stop_id: s1, stop_sequence: 1, arrival_ts: "2026-11-22 12:50:00+00", method: observed, confidence: high, scheduled_arrival_ts: "2026-11-22 12:50:00+00"}
    expect:
      rows:
        - {line: Red, trip_id: A, stop_id: s1, stop_name: Alpha, stop_sequence: 1, arrival_ts: "2026-11-22 13:20:00+00", method: observed, confidence: high, scheduled_ts: "2026-11-22 13:19:00+00", hour_start: "2026-11-22 13:00:00+00"}
        - {line: Red, trip_id: A, stop_id: s2, stop_name: Beta, stop_sequence: 2, arrival_ts: "2026-11-22 13:40:00+00", method: estimated, confidence: medium, scheduled_ts: "2026-11-22 13:41:00+00", hour_start: "2026-11-22 13:00:00+00"}

