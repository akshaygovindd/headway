  - name: slow_segments_threshold_persistence_and_severity
    config:
      tags: [r4]
    description: >-
      Midday, Red direction 0, minimum trips lowered to 4 for the test (the real default is 15). The
      normal of a segment is the median over the 7 days; last_7d observes the latest 3 service days
      (21 to 23 Nov), last_24h the last day. s1 +50 s (33 %) is flagged minor, and its implausible
      trip (5000 s) is counted as scheduled but not measured while its outage trip is left out
      entirely. s2 is 29 s over (not flagged), s3 exactly 30 s and 30 % (flagged, minor), s4 is
      59 s but 19.7 % (not flagged), s5 exactly 20 % and 60 s (flagged, moderate), s6 130 s over
      (severe). s7 has a median 50 s over but only half its trips slow (consistency rule: not
      flagged). s8 has 3 trips (below the minimum). last_24h has 2 trips per segment (below the
      minimum), so nothing is flagged there.
    model: agg_slow_segments
    overrides:
      vars:
        slow_segments: {min_trips: 4}
    given:
      - input: ref('int_window_hours')
        rows:
          - {window_label: last_7d, service_date: "2026-11-17", hour_local: 10, hour_start: "2026-11-17 15:00:00+00"}
