          - {line: Red, direction_id: 0, from_stop_id: a, to_stop_id: b, time_band: am_peak, window_label: last_7d, n_trips: 20, flagged: true, severity: minor, excess_s: 40.0, first_seen: "2026-11-23 15:01:00+00", last_seen: "2026-11-23 16:30:00+00", coverage_pct: 80.0}
          - {line: Red, direction_id: 0, from_stop_id: e, to_stop_id: f, time_band: midday, window_label: last_7d, n_trips: 25, flagged: true, severity: moderate, excess_s: 70.0, first_seen: "2026-11-23 15:01:00+00", last_seen: "2026-11-23 16:30:00+00", coverage_pct: 85.0}
