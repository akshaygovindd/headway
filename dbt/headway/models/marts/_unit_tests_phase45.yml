  - name: slow_zone_comparison_matched_observed_listed_and_unmapped
    config:
      tags: [r4]
    description: >-
      Snapshot of two restrictions, captured on 2026-11-20 (FIXTURE rows, not real MBTA data). R1 is
      mapped to segment a-b, R2 to c-d, R3 to nothing. Flagged segments: a-b (listed: matched; severe
      in midday, minor in am_peak: the strongest band wins, both bands are named) and e-f (not
      listed: observed_only). c-d is listed but not flagged with 40 trips seen (listed_only,
      not_flagged); R3 has no mapping and stays as listed_unmapped. A segment seen with 5 trips
      only (g-h) and a segment flagged at 40 % coverage (i-j, severe) are not counted as flagged and,
      listed by nothing, are not rows at all; a last_24h row is not compared (a-b severity stays that
      of last_7d).
