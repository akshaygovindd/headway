  - name: forecast_headway_share_uses_only_known_headways
    config:
      tags: [r3]
    description: >-
      Valid headways completed in the 60 minutes up to t and known by t: within at 13:50, gap at
      13:40, within at 13:30 (two thirds within). Left out: a headway that is not valid, one
      completed at 14:05, and one completed at 13:55 but known only at 14:02, a gap that would
      change the share.
