version: 2

unit_tests:
  - name: vehicle_stop_events_placement_and_exclusions
    config:
      tags: [r2]
    description: >-
      Shape S runs east to west along 42.0 N: points at 0 m (-71.00), 826 m (-71.01) and 1652 m
      (-71.02). Trip T1 on it has stop 2 projected at 826 m. A repeat of an observation from a
      later capture is dropped, a stale position is ignored, a STOPPED_AT row is pinned to its
      stop even when its coordinates lie elsewhere, a position that falls back behind an earlier
      one keeps the running maximum, and an ADDED trip is kept with its exclusion reason.
    model: int_vehicle_stop_events
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T1|2026-11-22|08:00:00", service_date: "2026-11-22", feed_version: fv, trip_id: T1, shape_id: S, stop_sequence: 2, stop_id: s2, dist_m: 826}
      - input: ref('stg_gtfs__shape_points_dist')
        rows:
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 1, lat: 42.0, lon: -71.00, dist_m: 0}
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 2, lat: 42.0, lon: -71.01, dist_m: 826}
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 3, lat: 42.0, lon: -71.02, dist_m: 1652}
      - input: ref('stg_gtfs__stop_shape_positions')
        rows:
          - {feed_version: fv, shape_id: S, stop_id: s2, stop_sequence: 2, dist_m: 826}
      - input: ref('stg_vehicle_positions')
        rows:
          - {capture_id: a1, fetched_at: "2026-11-22 13:00:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0001, lon: -71.0, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:00:00+00", is_stale_position: false}
          - {capture_id: a2, fetched_at: "2026-11-22 13:00:20+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0001, lon: -71.0, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:00:00+00", is_stale_position: false}
          - {capture_id: a3, fetched_at: "2026-11-22 13:01:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0095, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:01:00+00", is_stale_position: false}
          - {capture_id: a4, fetched_at: "2026-11-22 13:02:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0095, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:02:00+00", is_stale_position: true}
          - {capture_id: a5, fetched_at: "2026-11-22 13:03:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.001, current_status: STOPPED_AT, stop_id: s2, current_stop_sequence: 2, event_ts: "2026-11-22 13:03:00+00", is_stale_position: false}
          - {capture_id: a6, fetched_at: "2026-11-22 13:04:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0001, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:04:00+00", is_stale_position: false}
          - {capture_id: a7, fetched_at: "2026-11-22 13:00:35+00", vehicle_id: v9, trip_id: ADDED-1, route_id: Red, lat: 42.0, lon: -71.0, current_status: IN_TRANSIT_TO, event_ts: "2026-11-22 13:00:30+00", is_stale_position: false}
    expect:
      rows:
        - {vehicle_id: v1, trip_instance_key: "T1|2026-11-22|08:00:00", event_ts: "2026-11-22 13:00:00+00", capture_id: a1, raw_dist_m: 0, dist_m: 0, exclusion_reason: null}
        - {vehicle_id: v1, trip_instance_key: "T1|2026-11-22|08:00:00", event_ts: "2026-11-22 13:01:00+00", capture_id: a3, raw_dist_m: 826, dist_m: 826, exclusion_reason: null}
        - {vehicle_id: v1, trip_instance_key: "T1|2026-11-22|08:00:00", event_ts: "2026-11-22 13:03:00+00", capture_id: a5, raw_dist_m: 826, dist_m: 826, exclusion_reason: null}
        - {vehicle_id: v1, trip_instance_key: "T1|2026-11-22|08:00:00", event_ts: "2026-11-22 13:04:00+00", capture_id: a6, raw_dist_m: 0, dist_m: 826, exclusion_reason: null}
        - {vehicle_id: v9, trip_instance_key: "ADDED-1|2026-11-22|", event_ts: "2026-11-22 13:00:30+00", capture_id: a7, raw_dist_m: null, dist_m: null, exclusion_reason: added_trip}

  - name: vehicle_stop_events_reused_trip_id_starts_a_new_segment
    config:
      tags: [r2]
    description: >-
      A vehicle's current_stop_sequence on trip T1 goes 1, 2, 3 and then back to 1, 2: the second
      run is segment 1, and its distance restarts instead of holding the first run's maximum. A
      second vehicle on the same trip id has its own numbering (segment 0).
    model: int_vehicle_stop_events
    given:
      - input: ref('int_trip_stop_distances')
        rows:
          - {trip_instance_key: "T1|2026-11-22|08:00:00", service_date: "2026-11-22", feed_version: fv, trip_id: T1, shape_id: S, stop_sequence: 2, stop_id: s2, dist_m: 826}
      - input: ref('stg_gtfs__shape_points_dist')
        rows:
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 1, lat: 42.0, lon: -71.00, dist_m: 0}
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 2, lat: 42.0, lon: -71.01, dist_m: 826}
          - {feed_version: fv, shape_id: S, shape_pt_sequence: 3, lat: 42.0, lon: -71.02, dist_m: 1652}
      - input: ref('stg_gtfs__stop_shape_positions')
        rows:
          - {feed_version: fv, shape_id: S, stop_id: s2, stop_sequence: 2, dist_m: 826}
      - input: ref('stg_vehicle_positions')
        rows:
          - {capture_id: b1, fetched_at: "2026-11-22 13:00:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1, event_ts: "2026-11-22 13:00:00+00", is_stale_position: false}
          - {capture_id: b2, fetched_at: "2026-11-22 13:01:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0095, current_status: IN_TRANSIT_TO, current_stop_sequence: 2, event_ts: "2026-11-22 13:01:00+00", is_stale_position: false}
          - {capture_id: b3, fetched_at: "2026-11-22 13:02:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0195, current_status: IN_TRANSIT_TO, current_stop_sequence: 3, event_ts: "2026-11-22 13:02:00+00", is_stale_position: false}
          - {capture_id: b4, fetched_at: "2026-11-22 13:30:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1, event_ts: "2026-11-22 13:30:00+00", is_stale_position: false}
          - {capture_id: b5, fetched_at: "2026-11-22 13:31:05+00", vehicle_id: v1, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0095, current_status: IN_TRANSIT_TO, current_stop_sequence: 2, event_ts: "2026-11-22 13:31:00+00", is_stale_position: false}
          - {capture_id: b6, fetched_at: "2026-11-22 13:00:35+00", vehicle_id: v2, trip_id: T1, route_id: Red, lat: 42.0, lon: -71.0, current_status: IN_TRANSIT_TO, current_stop_sequence: 1, event_ts: "2026-11-22 13:00:30+00", is_stale_position: false}
    expect:
      rows:
        - {vehicle_id: v1, segment: 0, event_ts: "2026-11-22 13:00:00+00", dist_m: 0}
        - {vehicle_id: v1, segment: 0, event_ts: "2026-11-22 13:01:00+00", dist_m: 826}
        - {vehicle_id: v1, segment: 0, event_ts: "2026-11-22 13:02:00+00", dist_m: 1652}
        - {vehicle_id: v1, segment: 1, event_ts: "2026-11-22 13:30:00+00", dist_m: 0}
        - {vehicle_id: v1, segment: 1, event_ts: "2026-11-22 13:31:00+00", dist_m: 826}
        - {vehicle_id: v2, segment: 0, event_ts: "2026-11-22 13:00:30+00", dist_m: 0}

  - name: observation_window_counts_a_minute_once_however_many_polls
    description: >-
      Four vehicle_positions captures of minute 13:00 (polls 0-3) and one of 13:01 are two capture
      minutes, not five. A failed poll does not count, and a poll whose payload repeats the
      previous capture's is a duplicate and does not count either.
    model: int_observation_window
    given:
      - input: ref('int_captures')
        rows:
          - {capture_id: p0, feed: vehicle_positions, status: ok, is_duplicate_capture: false, capture_minute: "2026-11-22 13:00:00+00", service_date: "2026-11-22", hour_local: 8}
          - {capture_id: p1, feed: vehicle_positions, status: ok, is_duplicate_capture: false, capture_minute: "2026-11-22 13:00:00+00", service_date: "2026-11-22", hour_local: 8}
          - {capture_id: p2, feed: vehicle_positions, status: error, is_duplicate_capture: false, capture_minute: "2026-11-22 13:00:00+00", service_date: "2026-11-22", hour_local: 8}
          - {capture_id: p3, feed: vehicle_positions, status: ok, is_duplicate_capture: true, capture_minute: "2026-11-22 13:00:00+00", service_date: "2026-11-22", hour_local: 8}
          - {capture_id: q0, feed: vehicle_positions, status: ok, is_duplicate_capture: false, capture_minute: "2026-11-22 13:01:00+00", service_date: "2026-11-22", hour_local: 8}
          - {capture_id: t0, feed: trip_updates, status: ok, is_duplicate_capture: false, capture_minute: "2026-11-22 13:00:00+00", service_date: "2026-11-22", hour_local: 8}
    expect:
      rows:
        - {service_date: "2026-11-22", hour_local: 8, feed: vehicle_positions, capture_minutes: 2, window_complete: false}
        - {service_date: "2026-11-22", hour_local: 8, feed: trip_updates, capture_minutes: 1, window_complete: false}

  - name: captures_flag_a_repeated_payload_across_polls_of_one_minute
    description: >-
      Three vehicle polls of one scheduled minute: poll 1 repeats poll 0's payload and is flagged;
      poll 2 differs. Ordering is by poll_index within the minute, so all four polls share one
      capture_minute.
    model: int_captures
    given:
      - input: ref('stg_manifests')
        rows:
          - {capture_id: p0, run_id: r1, feed: vehicle_positions, status: ok, content_hash: h1, poll_index: 0, scheduled_at: "2026-11-22 13:00:00+00", fetched_at: "2026-11-22 13:00:17+00"}
          - {capture_id: p1, run_id: r1, feed: vehicle_positions, status: ok, content_hash: h1, poll_index: 1, scheduled_at: "2026-11-22 13:00:00+00", fetched_at: "2026-11-22 13:00:32+00"}
          - {capture_id: p2, run_id: r1, feed: vehicle_positions, status: ok, content_hash: h2, poll_index: 2, scheduled_at: "2026-11-22 13:00:00+00", fetched_at: "2026-11-22 13:00:47+00"}
    expect:
      rows:
        - {capture_id: p0, poll_index: 0, capture_minute: "2026-11-22 13:00:00+00", is_duplicate_capture: false}
        - {capture_id: p1, poll_index: 1, capture_minute: "2026-11-22 13:00:00+00", is_duplicate_capture: true}
        - {capture_id: p2, poll_index: 2, capture_minute: "2026-11-22 13:00:00+00", is_duplicate_capture: false}

  - name: hour_flags_outage_rules
    config:
      tags: [r2]
    description: >-
      The warn threshold of missed_runs in the seed is 3. Hour 8 has 2 missed runs and a complete
      window (no outage); hour 9 has 3 missed runs (outage); hour 10 has none but an incomplete
      vehicle window (outage). A trip_updates window row is ignored.
    model: int_hour_flags
    given:
      - input: ref('quality_thresholds')
        rows:
          - {check_name: missed_runs, warn: 3}
      - input: ref('agg_quality_checks_hourly')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, check_name: "missed_runs", value: 2.0}
          - {service_date: "2026-11-22", hour_local: 9, check_name: "missed_runs", value: 3.0}
          - {service_date: "2026-11-22", hour_local: 10, check_name: "missed_runs", value: 0.0}
          - {service_date: "2026-11-22", hour_local: 8, check_name: late_event_share, value: 90.0}
      - input: ref('int_observation_window')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, feed: "vehicle_positions", window_complete: true}
          - {service_date: "2026-11-22", hour_local: 9, feed: "vehicle_positions", window_complete: true}
          - {service_date: "2026-11-22", hour_local: 10, feed: "vehicle_positions", window_complete: false}
          - {service_date: "2026-11-22", hour_local: 11, feed: "trip_updates", window_complete: true}
    expect:
      rows:
        - {service_date: "2026-11-22", hour_local: 8, missed_runs: 2.0, vehicle_window_complete: true, data_outage: false}
        - {service_date: "2026-11-22", hour_local: 9, missed_runs: 3.0, vehicle_window_complete: true, data_outage: true}
        - {service_date: "2026-11-22", hour_local: 10, missed_runs: 0.0, vehicle_window_complete: false, data_outage: true}

  - name: usable_arrivals_keep_high_medium_and_nearest_segment
    config:
      tags: [r2]
    description: >-
      Only high and medium arrivals with a time and a schedule are kept. A trip stop reached by two
      runs of a reused trip id marks the run nearest the schedule. The outage and disruption flags
      are those of the arrival's local hour (09:00 EST here): hour 9 is an outage for the Red line
      stop and a disrupted hour for line Red.
    model: int_usable_arrivals
    given:
      - input: ref('fct_reconstructed_arrivals')
        rows:
          - {trip_instance_key: "R1|2026-11-22|08:00:00", service_date: "2026-11-22", trip_id: "R1", line: "Red", direction_id: 0, stop_id: "s1", vehicle_id: "v1", method: "observed", segment: 0, stop_sequence: 1, arrival_ts: "2026-11-22 14:00:30+00", confidence: "high", scheduled_arrival_ts: "2026-11-22 14:00:00+00"}
          - {trip_instance_key: "R1|2026-11-22|08:00:00", service_date: "2026-11-22", trip_id: "R1", line: "Red", direction_id: 0, stop_id: "s1", vehicle_id: "v1", method: "observed", segment: 1, stop_sequence: 1, arrival_ts: "2026-11-22 14:40:00+00", confidence: "medium", scheduled_arrival_ts: "2026-11-22 14:00:00+00"}
          - {trip_instance_key: "R1|2026-11-22|08:00:00", service_date: "2026-11-22", trip_id: "R1", line: "Red", direction_id: 0, stop_id: "s1", vehicle_id: "v1", method: "observed", segment: 0, stop_sequence: 2, arrival_ts: "2026-11-22 14:05:00+00", confidence: "low", scheduled_arrival_ts: "2026-11-22 14:05:00+00"}
          - {trip_instance_key: "R1|2026-11-22|08:00:00", service_date: "2026-11-22", trip_id: "R1", line: "Red", direction_id: 0, stop_id: "s1", vehicle_id: "v1", method: "observed", segment: 0, stop_sequence: 3, arrival_ts: null, confidence: null, scheduled_arrival_ts: "2026-11-22 14:10:00+00"}
      - input: ref('int_hour_flags')
        rows:
          - {service_date: "2026-11-22", hour_local: 9, data_outage: true}
      - input: ref('int_disrupted_line_hours')
        rows:
          - {line: "Red", service_date: "2026-11-22", hour_local: 9}
    expect:
      rows:
        - {trip_instance_key: "R1|2026-11-22|08:00:00", segment: 0, stop_sequence: 1, is_nearest_segment: true, deviation_s: 30, data_outage: true, service_disruption: true}
        - {trip_instance_key: "R1|2026-11-22|08:00:00", segment: 1, stop_sequence: 1, is_nearest_segment: false, deviation_s: 2400, data_outage: true, service_disruption: true}

  - name: alert_scopes_line_versus_stop
    config:
      tags: [r2]
    description: >-
      One capture. A Red DETOUR (shuttle) names stops of two stations (Davis, and Porter by its
      platform) and is line scope. A Green-E NO_SERVICE (Symphony closed) names the station and
      its two platforms: three stop ids, one station, so stop scope. An Orange DETOUR names the
      route without a stop: line scope. A Blue ACCESSIBILITY_ISSUE on one stop is stop scope and
      not a service disruption. A Red DETOUR whose period ended before the capture is not active.
    model: int_alert_scopes
    given:
      - input: ref('int_captures')
        rows:
          - {capture_id: "c1", service_date: "2026-11-22", hour_local: 8}
      - input: ref('dim_stop')
        rows:
          - {stop_id: "place-davis", stop_name: "Davis", parent_station: null}
          - {stop_id: "place-portr", stop_name: "Porter", parent_station: null}
          - {stop_id: "70064", stop_name: "Porter", parent_station: "place-portr"}
          - {stop_id: "place-symph", stop_name: "Symphony", parent_station: null}
          - {stop_id: "70242", stop_name: "Symphony", parent_station: "place-symph"}
          - {stop_id: "70243", stop_name: "Symphony", parent_station: "place-symph"}
          - {stop_id: "70001", stop_name: "Hynes", parent_station: null}
      - input: ref('stg_service_alerts')
        rows:
          - {capture_id: "c1", alert_id: "a1", route_id: "Red", stop_id: "place-davis", effect: "DETOUR", header_text: "Shuttle buses", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a1", route_id: "Red", stop_id: "70064", effect: "DETOUR", header_text: "Shuttle buses", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a2", route_id: "Green-E", stop_id: "place-symph", effect: "NO_SERVICE", header_text: "Symphony closed", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a2", route_id: "Green-E", stop_id: "70242", effect: "NO_SERVICE", header_text: "Symphony closed", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a2", route_id: "Green-E", stop_id: "70243", effect: "NO_SERVICE", header_text: "Symphony closed", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a3", route_id: "Orange", stop_id: null, effect: "DETOUR", header_text: "Detour", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a4", route_id: "Blue", stop_id: "70001", effect: "ACCESSIBILITY_ISSUE", header_text: "Elevator out", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: null}
          - {capture_id: "c1", alert_id: "a5", route_id: "Red", stop_id: "place-davis", effect: "DETOUR", header_text: "Old", fetched_at: "2026-11-22 13:00:00+00", active_start: null, active_end: "2026-11-22 12:00:00+00"}
    expect:
      rows:
        - {service_date: "2026-11-22", hour_local: 8, line: "Red", alert_id: "a1", is_service_disruption: true, route_level: false, n_stops: 2, stop_names: "Davis, Porter", scope: "line"}
        - {service_date: "2026-11-22", hour_local: 8, line: "Green-E", alert_id: "a2", is_service_disruption: true, route_level: false, n_stops: 1, stop_names: "Symphony", scope: "stop"}
        - {service_date: "2026-11-22", hour_local: 8, line: "Orange", alert_id: "a3", is_service_disruption: true, route_level: true, n_stops: 0, stop_names: null, scope: "line"}
        - {service_date: "2026-11-22", hour_local: 8, line: "Blue", alert_id: "a4", is_service_disruption: false, route_level: false, n_stops: 1, stop_names: "Hynes", scope: "stop"}

  - name: stop_alert_flags_only_stop_scope_disruptions
    config:
      tags: [r2]
    description: >-
      Only stop-scope service disruptions flag a station: the closed Symphony station is flagged
      for Green-E; a line-scope alert and a stop-scope alert that is not a disruption are not.
    model: int_stop_alert_flags
    given:
      - input: ref('int_alert_scopes')
        rows:
          - {service_date: "2026-11-22", hour_local: 8, line: "Green-E", alert_id: "a2", is_service_disruption: true, scope: "stop", station_ids: ["place-symph"]}
          - {service_date: "2026-11-22", hour_local: 8, line: "Red", alert_id: "a1", is_service_disruption: true, scope: "line", station_ids: ["place-davis", "place-portr"]}
          - {service_date: "2026-11-22", hour_local: 8, line: "Blue", alert_id: "a4", is_service_disruption: false, scope: "stop", station_ids: ["70001"]}
    expect:
      rows:
        - {line: "Green-E", service_date: "2026-11-22", hour_local: 8, station_id: "place-symph"}

  # ---- Release 3 leakage tests (ADR-019): each feature has a row that counts and rows from after t,
  # or known only after t, that must not change the value. t is 2026-11-22 14:00:00+00.
  - name: forecast_rolling_median_30m_uses_only_known_arrivals
    config:
      tags: [r3]
    description: >-
      Arrivals of Red in the 30 minutes up to t, known by t: 100 s late at 13:50 and 300 s at 13:40
      (median 200 s, two arrivals). Left out: 900 s at 13:20 (outside 30 minutes), 5000 s at 14:05
      (after t), 7000 s at 13:55 but known only at 14:02 (arrival_ts at or before t, known_at after
      t), a run that is not the nearest, and an arrival of another line.
    model: int_forecast_line_features
    given: &r3_line_inputs
      - input: ref('int_forecast_grid')
        rows:
          - {line: Red, service_date: "2026-11-22", hour_local: 9, prediction_ts: "2026-11-22 14:00:00+00", day_type: weekend}
      - input: ref('int_usable_arrivals')
        rows:
          - {line: Red, trip_instance_key: a1, segment: 0, stop_sequence: 1, arrival_ts: "2026-11-22 13:50:00+00", known_at: "2026-11-22 13:51:00+00", deviation_s: 100, is_nearest_segment: true}
