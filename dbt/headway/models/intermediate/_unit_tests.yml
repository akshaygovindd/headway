          - {line: Red, status: valid, band: gap, to_arrival_ts: "2026-11-22 13:40:00+00", known_at: "2026-11-22 13:41:00+00"}
          - {line: Red, status: valid, band: within, to_arrival_ts: "2026-11-22 13:30:00+00", known_at: "2026-11-22 13:31:00+00"}
          - {line: Red, status: train_between, band: null, to_arrival_ts: "2026-11-22 13:45:00+00", known_at: "2026-11-22 13:46:00+00"}
          - {line: Red, status: valid, band: gap, to_arrival_ts: "2026-11-22 14:05:00+00", known_at: "2026-11-22 14:06:00+00"}
          - {line: Red, status: valid, band: gap, to_arrival_ts: "2026-11-22 13:55:00+00", known_at: "2026-11-22 14:02:00+00"}
