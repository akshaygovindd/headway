        - {line: Red, headway_within_share: 0.6666666666666666, n_headways_60m: 3}

  - name: forecast_alert_flag_reads_latest_capture_up_to_t
    config:
      tags: [r3]
    description: >-
      The latest alerts capture at or before t (13:58) has a disruption on Red: the flag is true.
      A capture at 14:01, after t, has none and must not switch it off.
    model: int_forecast_line_features
    given:
      - input: ref('int_forecast_grid')
        rows:
          - {line: Red, service_date: "2026-11-22", hour_local: 9, prediction_ts: "2026-11-22 14:00:00+00", day_type: weekend}
      - input: ref('int_usable_arrivals')
        rows: []
      - input: ref('fct_headways')
        rows: []
      - input: ref('int_forecast_alert_captures')
        format: sql
        rows: |
          select 'k1' as capture_id, timestamptz '2026-11-22 13:58:00+00' as fetched_at, ['Red']::varchar[] as disrupted_lines
          union all select 'k2', timestamptz '2026-11-22 14:01:00+00', []::varchar[]
      - input: ref('fct_stop_predictions')
        rows: []
    expect:
      rows:
        - {line: Red, active_disruption_alert: true}

  - name: forecast_alert_flag_is_null_without_a_recent_capture
    config:
      tags: [r3]
    description: >-
      The only capture at or before t is 30 minutes old, so the flag is unknown; a capture after t
      with a disruption does not fill it in.
    model: int_forecast_line_features
    given:
      - input: ref('int_forecast_grid')
        rows:
          - {line: Red, service_date: "2026-11-22", hour_local: 9, prediction_ts: "2026-11-22 14:00:00+00", day_type: weekend}
      - input: ref('int_usable_arrivals')
        rows: []
      - input: ref('fct_headways')
        rows: []
      - input: ref('int_forecast_alert_captures')
        format: sql
        rows: |
          select 'k1' as capture_id, timestamptz '2026-11-22 13:30:00+00' as fetched_at, []::varchar[] as disrupted_lines
          union all select 'k2', timestamptz '2026-11-22 14:01:00+00', ['Red']::varchar[]
      - input: ref('fct_stop_predictions')
        rows: []
    expect:
      rows:
        - {line: Red, active_disruption_alert: null}

