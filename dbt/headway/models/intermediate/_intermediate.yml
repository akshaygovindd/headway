version: 2

models:
  - name: int_captures
    description: One row per capture attempt with its feed, run, timing and duplicate flag. A capture is a duplicate when its payload hash equals the previous successful capture of the same feed.
    config:
      meta:
        grain: "capture_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [capture_id]
    columns:
      - name: capture_id
        description: Capture identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_manifests')
                field: capture_id
      - name: run_id
        description: Ingest run that scheduled the capture.
        data_tests:
          - not_null
      - name: feed
        description: Feed fetched (trip_updates, vehicle_positions, alerts).
        data_tests:
          - not_null
      - name: scheduled_at
        description: UTC time the run was scheduled for.
        data_tests:
          - not_null
      - name: poll_index
        description: Position of the capture within its scheduled minute, 0-3 (0 fetches every feed, 1-3 are the 15 s vehicle polls); 0 for captures written before 15 s sampling.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: capture_minute
        description: scheduled_at truncated to the minute; the unit of observation coverage.
        data_tests:
          - not_null
      - name: fetched_at
        description: UTC time the fetch completed; null on failure.
      - name: status
        description: ok or error.
        data_tests:
          - not_null
      - name: content_hash
        description: SHA-256 of the payload; null on error.
      - name: entity_count
        description: Entities in the payload.
      - name: bytes
        description: Payload size in bytes.
      - name: is_duplicate_capture
        description: True when content_hash equals the previous successful capture of the same feed; false for failed captures.
        data_tests:
          - not_null
      - name: service_date
        description: Service date of scheduled_at (03:00 local cutoff).
        data_tests:
          - not_null
      - name: hour_local
        description: Local clock hour (0-23) of scheduled_at.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
  - name: int_feed_version_by_service_date
    description: "Current GTFS feed version for each service date seen in the data: the loaded version with the latest feed_start_date on or before the service date."
    config:
      meta:
        grain: "service_date"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date]
    columns:
      - name: service_date
        description: Service date.
        data_tests:
          - not_null
      - name: feed_version
        description: Current feed version for the service date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs__feed_info')
                field: feed_version
      - name: feed_start_date
        description: feed_start_date of the selected version.
        data_tests:
          - not_null
  - name: int_active_services
    description: service_ids running on each service date, from calendar weekday patterns and calendar_dates additions and removals.
    config:
      meta:
        grain: "service_date x service_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, service_id]
    columns:
      - name: service_date
        description: Service date.
        data_tests:
          - not_null
      - name: feed_version
        description: Feed version the service is taken from.
        data_tests:
          - not_null
      - name: service_id
        description: Active service identifier.
        data_tests:
          - not_null
  - name: int_scheduled_stop_times
    description: Scheduled stop times of subway routes for every active trip on each service date, with the scheduled arrival as a UTC timestamp.
    config:
      meta:
        grain: "trip_instance_key x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [trip_instance_key, stop_sequence]
    columns:
      - name: trip_instance_key
        description: trip_id, service_date and start_time joined with '|'.
        data_tests:
          - not_null
      - name: service_date
        description: Service date of the trip.
        data_tests:
          - not_null
      - name: feed_version
        description: Feed version the schedule comes from.
        data_tests:
          - not_null
      - name: trip_id
        description: Trip identifier.
        data_tests:
          - not_null
      - name: route_id
        description: Route identifier.
        data_tests:
          - not_null
      - name: line
        description: Reporting line; equal to route_id (for example Red, Green-B).
        data_tests:
          - not_null
      - name: direction_id
        description: Direction of travel (0 or 1).
      - name: trip_headsign
        description: Destination sign text.
      - name: start_time
        description: "Scheduled trip start: first stop departure time (HH:MM:SS, may exceed 24h)."
      - name: stop_id
        description: Stop identifier.
        data_tests:
          - not_null
      - name: stop_sequence
        description: Order of the stop within the trip.
        data_tests:
          - not_null
      - name: arrival_time
        description: Scheduled arrival as GTFS HH:MM:SS.
      - name: departure_time
        description: Scheduled departure as GTFS HH:MM:SS.
      - name: scheduled_arrival_ts
        description: Scheduled arrival as UTC timestamp using the GTFS noon-minus-12h rule.
        data_tests:
          - not_null
      - name: hour_local
        description: Local clock hour (0-23) of the scheduled arrival.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
  - name: int_observation_window
    description: Hours in which the pipeline was observing each feed. Aggregates only report hours present here.
    config:
      meta:
        grain: "service_date x hour_local x feed"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, hour_local, feed]
    columns:
      - name: service_date
        description: Service date of the captures.
        data_tests:
          - not_null
      - name: hour_local
        description: Local clock hour (0-23) of the captures.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: feed
        description: Feed observed.
        data_tests:
          - not_null
      - name: capture_minutes
        description: Distinct minutes in the hour with a successful, non-duplicate capture.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 60
      - name: window_complete
        description: True when capture_minutes is at least 55.
        data_tests:
          - not_null
  - name: int_trip_stop_distances
    description: Scheduled stops of each trip instance with their distance along the trip's shape (null dist_m when the trip has no shape or the stop no projection).
    config:
      meta:
        grain: "trip_instance_key x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [trip_instance_key, stop_sequence]
    columns:
      - name: trip_instance_key
        description: Trip instance identifier (trip_id, service date, start time).
        data_tests:
          - not_null
      - name: service_date
        description: Service date of the trip instance.
      - name: feed_version
        description: GTFS feed version the schedule comes from.
      - name: trip_id
        description: Scheduled trip identifier.
      - name: line
        description: Reporting line (the route id).
      - name: direction_id
        description: Direction of travel (0 or 1).
      - name: shape_id
        description: Shape the trip follows; null when the trip has none.
      - name: stop_sequence
        description: Position of the stop in the trip.
        data_tests:
          - not_null
      - name: stop_id
        description: Stop identifier.
      - name: scheduled_arrival_ts
        description: Scheduled arrival (UTC).
      - name: dist_m
        description: Metres along the shape of the stop's projection; null when unknown.
  - name: int_vehicle_stop_events
    description: One row per vehicle position observation of a trip, de-duplicated across captures, with stale positions removed and the observation placed on the trip's shape (dist_m, non-decreasing along a run of the trip id). Observations that cannot be placed carry an exclusion_reason and are not used for reconstruction.
    config:
      meta:
        grain: "vehicle_id x trip_instance_key x event_ts"
    data_tests:
      - unique_grain:
          arguments:
            columns: [vehicle_id, trip_instance_key, event_ts]
    columns:
      - name: vehicle_id
        description: Vehicle identifier.
        data_tests:
          - not_null
      - name: trip_instance_key
        description: Trip instance identifier; trip_id, service date of event_ts and scheduled start time (empty for unscheduled trips).
        data_tests:
          - not_null
      - name: segment
        description: Run of the trip id by this vehicle; 0 first, incremented when current_stop_sequence went backwards from the previous observation.
        data_tests:
          - not_null
      - name: event_ts
        description: Time the vehicle reported the position (UTC).
        data_tests:
          - not_null
      - name: capture_id
        description: First capture that carried the observation.
      - name: fetched_at
        description: When that capture was fetched.
      - name: service_date
        description: Service date of event_ts.
      - name: trip_id
        description: Trip identifier from the feed.
      - name: line
        description: Route id reported by the vehicle.
      - name: direction_id
        description: Direction of travel (0 or 1).
      - name: shape_id
        description: Shape of the scheduled trip; null when unscheduled.
      - name: current_status
        description: Vehicle status (INCOMING_AT, STOPPED_AT, IN_TRANSIT_TO).
      - name: current_stop_sequence
        description: Stop sequence the status refers to.
      - name: stop_id
        description: Stop the status refers to.
      - name: lat
        description: Latitude.
      - name: lon
        description: Longitude.
      - name: raw_dist_m
        description: Metres along the shape, before the non-decreasing correction; null when it could not be placed.
      - name: dist_m
        description: Metres along the shape, running maximum of raw_dist_m over the trip.
      - name: exclusion_reason
        description: Why the observation is not used for reconstruction; null when it is used.
        data_tests:
          - accepted_values:
              arguments:
                values: [added_trip, unscheduled_trip, no_shape, off_shape]
  - name: int_hour_flags
    description: "Hours the vehicle positions were observed with the Release 2 data-outage flag: missed runs at or above the warn threshold of the quality_thresholds seed, or an incomplete vehicle_positions window."
    config:
      meta:
        grain: "service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, hour_local]
    columns:
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
      - name: missed_runs
        description: "Missed scheduler runs in the hour."
      - name: vehicle_window_complete
        description: "True when the vehicle_positions window has at least 55 capture minutes."
      - name: data_outage
        description: "True when missed_runs reaches the seed threshold or the vehicle window is incomplete."
        data_tests:
          - not_null
  - name: int_alert_scopes
    description: "Active service alerts per line, hour and alert with their scope: line (route-level entity, or two or more stations) or stop (one station). A station is the parent station of a stop."
    config:
      meta:
        grain: "service_date x hour_local x line x alert_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [service_date, hour_local, line, alert_id]
    columns:
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23) of the capture."
        data_tests:
          - not_null
      - name: line
        description: "Reporting line (route_id) of the informed entity."
        data_tests:
          - not_null
      - name: alert_id
        description: "Alert identifier."
        data_tests:
          - not_null
      - name: effect
        description: "GTFS-realtime alert effect."
      - name: header_text
        description: "Header text of the alert."
      - name: first_seen
        description: "First capture of the hour in which the alert was active (UTC)."
      - name: last_seen
        description: "Last capture of the hour in which the alert was active (UTC)."
      - name: is_service_disruption
        description: "True when the effect or header text makes the hour a service disruption."
      - name: route_level
        description: "True when an informed entity names the route without a stop."
      - name: n_stops
        description: "Distinct stations covered."
      - name: station_ids
        description: "The stations covered."
      - name: stop_names
        description: "Names of the stations covered."
      - name: capture_ids
        description: "Captures of the hour that carried the alert while active."
      - name: scope
        description: "line or stop."
        data_tests:
          - not_null
  - name: int_stop_alert_flags
    description: "Stations under a stop-level service-disruption alert, per line and hour. Their trip stops are left out of arrival coverage; the line is not disrupted."
    config:
      meta:
        grain: "line x service_date x hour_local x station_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, service_date, hour_local, station_id]
    columns:
      - name: line
        description: "Reporting line (route_id)."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
      - name: station_id
        description: "Parent station of the flagged stop, else the stop."
        data_tests:
          - not_null
  - name: int_disrupted_line_hours
    description: "Line hours with at least one active line-scope service-disruption alert."
    config:
      meta:
        grain: "line x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line (route_id)."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
  - name: int_usable_arrivals
    description: "High and medium confidence reconstructed arrivals that match a scheduled stop, with the outage and disruption flags of the arrival hour; the only arrivals the Release 2 metrics use."
    config:
      meta:
        grain: "trip_instance_key x segment x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [trip_instance_key, segment, stop_sequence]
    columns:
      - name: trip_instance_key
        description: "Trip instance identifier."
        data_tests:
          - not_null
      - name: segment
        description: "Run of the trip id."
        data_tests:
          - not_null
      - name: stop_sequence
        description: "Position of the stop in the trip."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date of the trip instance."
      - name: trip_id
        description: "Scheduled trip identifier."
      - name: line
        description: "Reporting line."
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: stop_id
        description: "Stop identifier."
      - name: vehicle_id
        description: "Vehicle the arrival was reconstructed from."
      - name: arrival_ts
        description: "Reconstructed arrival (UTC)."
      - name: method
        description: "observed or bracketed."
      - name: confidence
        description: "high or medium."
        data_tests:
          - accepted_values:
              arguments:
                values: [high, medium]
      - name: scheduled_arrival_ts
        description: "Scheduled arrival (UTC)."
      - name: known_at
        description: "When the arrival was known (UTC): fct_reconstructed_arrivals.known_at."
      - name: arrival_service_date
        description: "Service date of the arrival time."
      - name: arrival_hour_local
        description: "Local hour of the arrival."
      - name: sched_hour_local
        description: "Local hour of the scheduled arrival."
      - name: deviation_s
        description: "Reconstructed minus scheduled arrival in seconds."
      - name: is_nearest_segment
        description: "True for the run whose arrival is closest to the schedule when a reused trip id reached the stop more than once."
      - name: data_outage
        description: "Data-outage flag of the arrival hour."
        data_tests:
          - not_null
      - name: service_disruption
        description: "True when the line had an active service-disruption alert in the arrival hour."
        data_tests:
          - not_null

  - name: int_window_hours
    description: "Service hours inside each rolling window of the exact window marts: last_24h (24 hours) and last_7d (168 hours) ending at the latest hour of agg_line_reliability_hourly."
    config:
      meta:
        grain: "window_label x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [window_label, service_date, hour_local]
    columns:
      - name: window_label
        description: "last_24h or last_7d."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
      - name: hour_start
        description: "Start of the hour."
        data_tests:
          - not_null
  - name: int_scheduled_headways
    description: "Scheduled headways per line, direction, service date and hour of the later train: scheduled stop times with a predecessor at their stop."
    config:
      meta:
        grain: "line x direction_id x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local hour of the later train's scheduled arrival."
        data_tests:
          - not_null
      - name: scheduled_headways
        description: "Scheduled headways in the hour."
        data_tests:
          - not_null
  - name: int_forecast_grid
    description: "Prediction times of the Release 3 forecast examples: every quarter hour of the service hours (05:00 to 01:00 local) per line with scheduled service that day, in hours that are not a data outage."
    config:
      meta:
        grain: "line x prediction_ts"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date of the prediction time."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour of the prediction time."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC), on the quarter hour."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend, from the service date."
        data_tests:
          - not_null
  - name: int_forecast_alert_captures
    description: "One row per successful alerts capture with the lines under an active line-scope service disruption in it: the per-capture form of int_alert_scopes, read by the forecast features at the latest capture at or before t."
    config:
      meta:
        grain: "capture_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [capture_id]
    columns:
      - name: capture_id
        description: "Alerts capture."
        data_tests:
          - not_null
      - name: fetched_at
        description: "When the capture was fetched (UTC)."
        data_tests:
          - not_null
      - name: disrupted_lines
        description: "Lines with an active line-scope service disruption in the capture (empty list when none)."
  - name: int_forecast_line_features
    description: "Line-level forecast features per line and prediction time t, from inputs known at t only (known_at, collected_at or fetched_at at most t): rolling median delay over 30 and 60 minutes, headway adherence, active disruption alert, skipped share of the last hour."
    config:
      meta:
        grain: "line x prediction_ts"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC)."
        data_tests:
          - not_null
      - name: rolling_median_delay_30m
        description: "Median delay in seconds of the line's usable arrivals in the 30 minutes up to t, known at t; null without arrivals."
      - name: n_arrivals_30m
        description: "Arrivals behind rolling_median_delay_30m."
        data_tests:
          - not_null
      - name: rolling_median_delay_60m
        description: "Median delay in seconds of the line's usable arrivals in the 60 minutes up to t, known at t; null without arrivals."
      - name: n_arrivals_60m
        description: "Arrivals behind rolling_median_delay_60m."
        data_tests:
          - not_null
      - name: headway_within_share
        description: "Share (0-1) of the valid headways completed in the 60 minutes up to t, known at t, within 0.5 to 1.5 times the scheduled headway; null without headways."
      - name: n_headways_60m
        description: "Headways behind headway_within_share."
        data_tests:
          - not_null
      - name: active_disruption_alert
        description: "True when the latest alerts capture at or before t, at most 15 minutes old, has a line-scope service disruption on the line; null when there is no such capture."
      - name: skipped_share_1h
        description: "Share (0-1) of the line's trip update snapshots collected in the hour up to t whose stop is SKIPPED; null without snapshots."
      - name: n_snapshots_1h
        description: "Snapshots behind skipped_share_1h."
        data_tests:
          - not_null
  - name: int_forecast_gate_days
    description: "Service days per line with their arrival coverage (usable arrivals over scheduled trip stops of non-outage hours, as the arrival_coverage SLO) and whether the day meets the forecast gate's coverage threshold."
    config:
      meta:
        grain: "line x service_date"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, service_date]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend."
        data_tests:
          - not_null
      - name: n_arrivals
        description: "Usable arrivals of the day in non-outage hours."
      - name: n_scheduled_trip_stops
        description: "Scheduled trip stops of the day in non-outage hours."
      - name: coverage_pct
        description: "100 times n_arrivals over n_scheduled_trip_stops; null without scheduled trip stops."
      - name: meets_coverage
        description: "True when coverage_pct reaches forecast_gate.min_coverage_pct."
        data_tests:
          - not_null
  - name: int_forecast_targets
    description: "Target trip stops of the forecast examples: for each prediction time t and horizon (15, 30 or 60 minutes), the usable arrivals scheduled in the 15-minute slot that starts a horizon after t, with the delay label. Hours of t or of the arrival that are a data outage are left out. Only the label and target_arrival_ts come from after t."
    config:
      meta:
        grain: "line x prediction_ts x horizon_min x trip_instance_key x segment x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts, horizon_min, trip_instance_key, segment, stop_sequence]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC)."
        data_tests:
          - not_null
      - name: prediction_service_date
        description: "Service date of t."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour of t."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend."
        data_tests:
          - not_null
      - name: horizon_min
        description: "Minutes from t to the start of the target slot: 15, 30 or 60."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel."
      - name: stop_id
        description: "Stop of the target arrival."
        data_tests:
          - not_null
      - name: trip_instance_key
        description: "Trip instance of the target arrival."
        data_tests:
          - not_null
      - name: segment
        description: "Run of the trip id."
        data_tests:
          - not_null
      - name: stop_sequence
        description: "Stop sequence of the target stop."
        data_tests:
          - not_null
      - name: scheduled_arrival_ts
        description: "Scheduled arrival of the target (UTC)."
        data_tests:
          - not_null
      - name: target_arrival_ts
        description: "Reconstructed arrival of the target (UTC)."
        data_tests:
          - not_null
      - name: label_delay_s
        description: "Label: reconstructed minus scheduled arrival in seconds (positive is late)."
        data_tests:
          - not_null
  - name: int_forecast_serving_grid
    description: "Prediction time of the forecast served now (Release 3): the latest quarter hour at or before the as-of time, per line with scheduled service in the next hour. Same columns as int_forecast_grid, so the shared feature SQL reads it unchanged; outage hours are not dropped."
    config:
      meta:
        grain: "line x prediction_ts"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date of the prediction time."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour of the prediction time."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC), on the quarter hour."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend, from the service date."
        data_tests:
          - not_null
      - name: as_of_ts
        description: "The as-of time: the forecast_as_of var, or the latest successful capture."
        data_tests:
          - not_null
  - name: int_forecast_serving_targets
    description: "Trip stops to forecast now: for the serving prediction time t and each horizon (15, 30, 60 minutes), the trip stops scheduled in the 15-minute slot that starts a horizon after t. Columns as int_forecast_targets; the label columns are null."
    config:
      meta:
        grain: "line x prediction_ts x horizon_min x trip_instance_key x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts, horizon_min, trip_instance_key, stop_sequence]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC)."
        data_tests:
          - not_null
      - name: prediction_service_date
        description: "Service date of t."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour of t."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend."
        data_tests:
          - not_null
      - name: horizon_min
        description: "Minutes from t to the start of the target slot: 15, 30 or 60."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel."
      - name: stop_id
        description: "Stop of the target arrival."
        data_tests:
          - not_null
      - name: trip_instance_key
        description: "Trip instance of the target arrival."
        data_tests:
          - not_null
      - name: segment
        description: "Run of the trip id."
      - name: stop_sequence
        description: "Stop sequence of the target stop."
        data_tests:
          - not_null
      - name: scheduled_arrival_ts
        description: "Scheduled arrival of the target (UTC)."
        data_tests:
          - not_null
      - name: target_arrival_ts
        description: "Always null: the arrival has not happened yet."
      - name: label_delay_s
        description: "Always null: the arrival has not happened yet."
  - name: int_forecast_serving_line_features
    description: "Line-level forecast features at the serving prediction time, from the same SQL as int_forecast_line_features (macros/forecast_features.sql): inputs known at t only."
    config:
      meta:
        grain: "line x prediction_ts"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC)."
        data_tests:
          - not_null
      - name: rolling_median_delay_30m
        description: "Median delay in seconds of the line's usable arrivals in the 30 minutes up to t, known at t; null without arrivals."
      - name: n_arrivals_30m
        description: "Arrivals behind rolling_median_delay_30m."
        data_tests:
          - not_null
      - name: rolling_median_delay_60m
        description: "Median delay in seconds of the line's usable arrivals in the 60 minutes up to t, known at t; null without arrivals."
      - name: n_arrivals_60m
        description: "Arrivals behind rolling_median_delay_60m."
        data_tests:
          - not_null
      - name: headway_within_share
        description: "Share (0-1) of the valid headways completed in the 60 minutes up to t, known at t, within 0.5 to 1.5 times the scheduled headway; null without headways."
      - name: n_headways_60m
        description: "Headways behind headway_within_share."
        data_tests:
          - not_null
      - name: active_disruption_alert
        description: "True when the latest alerts capture at or before t, at most 15 minutes old, has a line-scope service disruption on the line; null when there is no such capture."
      - name: skipped_share_1h
        description: "Share (0-1) of the line's trip update snapshots collected in the hour up to t whose stop is SKIPPED; null without snapshots."
      - name: n_snapshots_1h
        description: "Snapshots behind skipped_share_1h."
        data_tests:
          - not_null
  - name: int_forecast_serving_features
    description: "Features of the trip stops to forecast now, from the same SQL as fct_forecast_examples (macros/forecast_features.sql) over the serving targets: the model's and the baselines' inputs. Label columns are null."
    config:
      meta:
        grain: "line x prediction_ts x horizon_min x trip_instance_key x stop_sequence"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, prediction_ts, horizon_min, trip_instance_key, stop_sequence]
    columns:
      - name: line
        description: "Reporting line (feature)."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (feature)."
      - name: stop_id
        description: "Stop of the target arrival."
        data_tests:
          - not_null
      - name: prediction_ts
        description: "Prediction time t (UTC), on the quarter hour."
        data_tests:
          - not_null
      - name: horizon_min
        description: "Minutes from t to the start of the target slot: 15, 30 or 60."
        data_tests:
          - not_null
      - name: trip_instance_key
        description: "Trip instance of the target arrival."
        data_tests:
          - not_null
      - name: segment
        description: "Run of the trip id (0 for the first)."
      - name: stop_sequence
        description: "Stop sequence of the target stop on the trip."
        data_tests:
          - not_null
      - name: service_date
        description: "Service date of the prediction time."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour of t (feature)."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend (feature)."
        data_tests:
          - not_null
      - name: stop_position
        description: "Distance of the stop along the trip's shape as a share of the trip (0-1) (feature); null without a shape position."
      - name: scheduled_headway_s
        description: "Seconds since the previous scheduled train at the stop (feature); null for the first of the day."
      - name: last_upstream_delay_s
        description: "Delay in seconds of the same run at its latest earlier stop known at t (feature); null when none."
      - name: rolling_median_delay_30m
        description: "Median delay of the line's arrivals known at t over the previous 30 minutes (feature)."
      - name: rolling_median_delay_60m
        description: "Same over the previous 60 minutes (feature)."
      - name: headway_within_share
        description: "Share of the line's headways completed in the previous 60 minutes, known at t, that were within band (feature)."
      - name: active_disruption_alert
        description: "True when a line-scope service disruption was active on the line in the latest alerts capture at or before t (feature)."
      - name: skipped_share_1h
        description: "Share of the line's snapshots of the hour before t that were SKIPPED (feature)."
      - name: mbta_predicted_deviation_s
        description: "MBTA's predicted deviation for the trip stop from the latest snapshot collected at or before t (feature, and the reference line of a forecast report, not a baseline)."
      - name: scheduled_arrival_ts
        description: "Scheduled arrival of the target (UTC); in [t + horizon, t + horizon + 15 min)."
        data_tests:
          - not_null
      - name: target_arrival_ts
        description: "Always null in serving."
      - name: label_delay_s
        description: "Always null in serving."
  - name: int_deviation_hour_history
    description: "Hourly actual deviation of this build plus the closed days of immutable history (ADR-015, through history_union): the data the Release 3 incident baseline is computed from."
    config:
      meta:
        grain: "line x direction_id x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
      - name: data_outage
        description: "True when the hour is a data outage; statistics are empty."
        data_tests:
          - not_null
      - name: median_deviation_s
        description: "Median actual deviation in seconds; null for outage hours."
      - name: coverage_pct
        description: "Arrival coverage (0-100)."
  - name: int_incident_hours
    description: "Incident rules evaluated per line, direction, service date and hour (Release 3): the values, the day type x hour baseline and whether it is enabled, and which rules the hour crosses. Outage hours never breach."
    config:
      meta:
        grain: "line x direction_id x service_date x hour_local"
    data_tests:
      - unique_grain:
          arguments:
            columns: [line, direction_id, service_date, hour_local]
    columns:
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: direction_id
        description: "Direction of travel (0 or 1)."
      - name: service_date
        description: "Service date."
        data_tests:
          - not_null
      - name: hour_local
        description: "Local clock hour (0-23)."
        data_tests:
          - not_null
      - name: hour_start
        description: "Local start of the hour on the service day timeline (hours before the cutoff belong to the next calendar day)."
        data_tests:
          - not_null
      - name: day_type
        description: "weekday or weekend."
        data_tests:
          - not_null
      - name: data_outage
        description: "True when the hour is a data outage (not evaluated)."
        data_tests:
          - not_null
      - name: median_deviation_s
        description: "Median actual deviation in seconds."
      - name: coverage_pct
        description: "Arrival coverage (0-100)."
      - name: baseline_days
        description: "Earlier service days of the same day type behind the baseline."
        data_tests:
          - not_null
      - name: baseline_median_s
        description: "Median deviation of those days at this hour."
      - name: baseline_enabled
        description: "True when baseline_days reaches incidents.min_baseline_days; the deviation rule is off otherwise."
        data_tests:
          - not_null
      - name: pct_gap
        description: "Headway gap share (0-100)."
      - name: skipped_pct
        description: "Share of observable trip stops that were skipped (0-100)."
      - name: alert_active
        description: "True when a line-scope service-disruption alert was active."
        data_tests:
          - not_null
      - name: crossed_deviation
        description: "Median deviation at least the threshold above the baseline."
        data_tests:
          - not_null
      - name: crossed_gap
        description: "Gap share at or above the threshold."
        data_tests:
          - not_null
      - name: crossed_skipped
        description: "Skipped share at or above the threshold."
        data_tests:
          - not_null
      - name: crossed_alert
        description: "A line-scope service-disruption alert was active."
        data_tests:
          - not_null
      - name: breach
        description: "Any rule crossed in a non-outage hour."
        data_tests:
          - not_null
  - name: int_alert_matching
    description: "Incidents and line-scope service-impacting alerts, each with its counterparts within the match window (Release 3): matched, unmatched_incident or unmatched_alert, and the alert lag of matched incidents."
    config:
      meta:
        grain: "kind x item_id x line"
    data_tests:
      - unique_grain:
          arguments:
            columns: [kind, item_id, line]
