        description: "incident or alert."
        data_tests:
          - not_null
      - name: item_id
        description: "incident_id or alert_id."
        data_tests:
          - not_null
      - name: line
        description: "Reporting line."
        data_tests:
          - not_null
      - name: event_ts
        description: "Incident start or alert first capture (UTC)."
      - name: service_date
        description: "Service date of event_ts."
        data_tests:
          - not_null
      - name: n_counterparts
        description: "Number of matching alerts (for an incident) or incidents (for an alert)."
        data_tests:
          - not_null
      - name: match_status
        description: "matched, unmatched_incident or unmatched_alert."
        data_tests:
          - not_null
      - name: alert_lag_s
        description: "Seconds from incident start to the first matching alert's first capture; null for alerts and unmatched incidents."
      - name: first_alert_id
        description: "The first matching alert of an incident."
      - name: counterpart_ids
        description: "Comma-separated ids of the counterparts."
  - name: int_stop_stations
    description: "The station of each stop: its parent station when it has one, else the stop itself, with the station's name."
    config:
      meta:
        grain: "stop_id"
    data_tests:
      - unique_grain:
          arguments:
            columns: [stop_id]
    columns:
      - name: stop_id
        description: "Stop identifier."
        data_tests:
          - not_null
      - name: station_id
        description: "Parent station, or the stop itself when it has none."
        data_tests:
          - not_null
      - name: station_name
        description: "Name of the station."
  - name: int_countdown_snapshots
    description: "The countdown snapshot of MBTA's published predictions per trip stop and countdown bucket (1, 3, 5 or 10 minutes, within 30 seconds of the centre): the one closest to the bucket centre."
    config:
      meta:
        grain: "trip_instance_key x stop_sequence x countdown_min"
    data_tests:
      - unique_grain:
          arguments:
            columns: [trip_instance_key, stop_sequence, countdown_min]
    columns:
      - name: trip_instance_key
        description: "Trip instance identifier."
        data_tests:
          - not_null
      - name: stop_sequence
        description: "Position of the stop in the trip."
        data_tests:
          - not_null
      - name: countdown_min
        description: "Countdown bucket centre in minutes: 1, 3, 5 or 10."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 3, 5, 10]
      - name: capture_id
        description: "Capture the snapshot came from."
      - name: collected_at
        description: "When the snapshot was collected."
      - name: service_date
        description: "Service date of the trip."
      - name: line
        description: "Reporting line."
      - name: direction_id
        description: "Direction of the trip."
      - name: stop_id
        description: "Stop the prediction is for."
      - name: predicted_arrival_ts
        description: "Predicted arrival time in the snapshot."
      - name: countdown_s
        description: "Predicted arrival minus collection time in seconds."
      - name: centre_distance_s
        description: "Distance of the countdown from the bucket centre in seconds (0 to 30)."
