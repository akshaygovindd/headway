name: headway
version: "0.1.0"
config-version: 2
profile: headway

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Root of a `headway replay` target (contains curated/, quarantine/, manifests/).
  curated_root: .local/replay
  city_prefix: boston
  timezone: America/New_York
  service_day_cutoff_hour: 3
  # GTFS route_type values treated as subway (0 light rail, 1 subway) for scheduled stop times.
  subway_route_types: [0, 1]
  # An hour with fewer scheduled subway trip-stops than this has no service: content checks read no_service.
  no_service_min_trip_stops: 20
  # Days of realtime history read by staging models (partition `dt`); null reads everything.
  lookback_days: null
  # Upper end of the SLO measurement, as an ISO timestamp; null uses the latest captured minute (local
  # and replay builds). The transform sets it to 30 minutes before now, so data curation has not
  # yet caught up with does not count as missing.
  slo_as_of: null
  # Release 2 history (ADR-015); set by the transform when HEADWAY_ENABLE_R2=true, null elsewhere.
  history_root: null
  metric_versions: {}
  # Release 3 training gate (ADR-019): a line can be trained on once it has min_days service days with
  # arrival coverage of at least min_coverage_pct, min_weekend_days of them weekend days.
  # Release 3 serving: the as-of time of the served forecast (ISO); null uses the latest successful capture.
  forecast_as_of: null
  forecast_gate:
    min_coverage_pct: 70
    min_days: 21
    min_weekend_days: 3
  # Release 3 incidents (docs/METRICS.md): an hour breaches when the median actual deviation is
  # deviation_over_baseline_s above the day type x hour baseline (the rule is off until the baseline
  # has min_baseline_days service days of that day type), the headway gap share reaches
  # gap_share_pct, the skipped-stop share reaches skipped_share_pct, or a line-scope service
  # disruption alert is active. An incident opens at min_hours consecutive breach hours and closes
  # after one hour with none. match_window_min widens the alert/incident overlap in both directions.
  incidents:
    min_hours: 2
    deviation_over_baseline_s: 180
    gap_share_pct: 30
    skipped_share_pct: 20
    min_baseline_days: 14
    match_window_min: 30

models:
  headway:
    # Static GTFS staging stays a view. Realtime staging reads S3 (httpfs) and every downstream
    # model and test would re-scan it, so it is materialized once per run; tagged s3_load so the
    # transform can run, and time, that step on its own.
    staging:
      +materialized: view
      stg_manifest_deliveries: &s3_load
        +materialized: table
        +tags: ["s3_load"]
      stg_manifests: *s3_load
      stg_quarantine: *s3_load
      # Release 3 (ADR-022); skipped by the transform unless HEADWAY_ENABLE_R3=true.
      stg_weather_daily:
        +tags: ["r3"]
      stg_official_speed_restrictions:
        +tags: ["r4"]
      stg_service_alerts: *s3_load
      stg_trip_updates: *s3_load
      stg_vehicle_positions: *s3_load
      # Release 2 models: tag r2. The transform Lambda skips them unless HEADWAY_ENABLE_R2=true;
      # local builds and CI build everything.
      stg_gtfs__shape_points_dist: &r2
        +tags: ["r2"]
      stg_gtfs__stop_shape_positions: *r2
      stg_transform_runs: *r2
    intermediate:
      +materialized: table
      int_trip_stop_distances: *r2
      int_vehicle_stop_events: *r2
      int_hour_flags: *r2
      int_disrupted_line_hours: *r2
      int_alert_scopes: *r2
      int_stop_alert_flags: *r2
      int_usable_arrivals: *r2
      int_window_hours: *r2
      int_stop_stations: *r2
      int_countdown_snapshots: *r2
      int_scheduled_headways: *r2
      # Release 3 models: tag r3, skipped by the transform Lambda unless HEADWAY_ENABLE_R3=true (they
      # also need R2); local builds and CI build everything.
      int_forecast_grid: &r3
        +tags: ["r3"]
      int_forecast_alert_captures: *r3
      int_forecast_line_features: *r3
      int_forecast_gate_days: *r3
      int_forecast_targets: *r3
      int_forecast_serving_grid: *r3
      int_forecast_serving_targets: *r3
      int_forecast_serving_line_features: *r3
      int_forecast_serving_features: *r3
      int_deviation_hour_history: *r3
      int_incident_hours: *r3
      int_alert_matching: *r3
      int_segment_travel_times:
        +tags: ["r4"]
      int_accessibility_outages:
        +tags: ["r4"]
    marts:
      +materialized: table
      fct_reconstructed_arrivals: *r2
      agg_arrival_reconstruction_daily: *r2
      agg_active_alerts: *r2
      fct_prediction_errors: *r2
      agg_prediction_accuracy_daily: *r2
      agg_actual_deviation_hourly: *r2
      fct_headways: *r2
      agg_headway_adherence_hourly: *r2
      agg_ett_daily: *r2
      agg_accuracy_window: *r2
      fct_countdown_outcomes: *r2
      agg_countdown_accuracy_window: *r2
      agg_countdown_accuracy_daily: *r2
      agg_actual_deviation_window: *r2
      agg_headway_window: *r2
      agg_ett_window: *r2
      agg_actual_deviation_daily: *r2
      agg_headway_adherence_daily: *r2
      agg_slo_daily: *r2
      agg_slo_rollup: *r2
      fct_forecast_examples: *r3
      agg_forecast_gate: *r3
      agg_forecast_gate_status: *r3
      agg_forecast_backtest: *r3
      agg_forecast_next_hour: *r3
      fct_incidents: *r3
      agg_incidents: *r3
      agg_alert_matching_daily: *r3
      agg_weather_comparison: *r3
      # Release 4 models: tag r4, skipped by the transform Lambda unless HEADWAY_ENABLE_R4=true (they
      # also need R2); local builds and CI build everything.
      agg_headway_segment_window: &r4
        +tags: ["r4"]
      agg_marey_last_hour: *r4
      agg_capture_heartbeat_hourly: *r4
      agg_ett_band_window: *r4
      agg_service_disruptions: *r4
      agg_trip_time_budget: *r4
      agg_slow_segments: *r4
      agg_slow_zone_comparison: *r4
      agg_accessibility_outages: *r4

seeds:
  headway:
    slo_targets: *r2
    quality_thresholds:
      +column_types:
        warn: double
        fail: double
    # Phase 4.5 (tag r4): the MBTA's speed restrictions, typed in by hand from its public page and
    # committed with no rows until captured (ADR-025, RUNBOOK "Capturing the official slow-zone
    # snapshot by hand"), and the mapping of each restriction to the segments it covers. Every
    # column is text; stg_official_speed_restrictions casts them.
    official_speed_restrictions:
      +tags: ["r4"]
      +column_types:
        restriction_id: varchar
        line: varchar
        location_text: varchar
        direction: varchar
        speed_limit_mph: varchar
        reason: varchar
        date_reported: varchar
        source_url: varchar
        captured_on: varchar
    official_restriction_segments:
      +tags: ["r4"]
      +column_types:
        restriction_id: varchar
        line: varchar
        direction_id: varchar
        from_stop_id: varchar
        to_stop_id: varchar
