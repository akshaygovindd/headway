headway:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '.local/headway.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC
    # Lambda: DuckDB file in /tmp, S3 read/write through httpfs with the function role.
    lambda:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '/tmp/headway.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
      # Connect-time options: dbt-duckdb installs extensions right after connecting, before any
      # `settings` apply, so the read-only default home (~/.duckdb) must be overridden here.
      config_options:
        home_directory: /tmp
        extension_directory: "{{ env_var('HEADWAY_DUCKDB_EXTENSIONS', '/tmp/duckdb_extensions') }}"
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          provider: credential_chain
    # Defined only; not run in Release 1 local work.
    motherduck:
      type: duckdb
      path: "md:headway"
      threads: 4
      settings:
        TimeZone: UTC
      config_options:
        motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"
