headway:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '.local/headway.duckdb') }}"
      threads: 4
      settings:
        TimeZone: UTC
    # Lambda: DuckDB file in /tmp, S3 read/write through httpfs with the function role.
    lambda:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '/tmp/headway.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
      # Connect-time options: dbt-duckdb installs extensions right after connecting, before any
      # `settings` apply, so the read-only default home (~/.duckdb) must be overridden here.
      config_options:
        home_directory: /tmp
        extension_directory: "{{ env_var('HEADWAY_DUCKDB_EXTENSIONS', '/tmp/duckdb_extensions') }}"
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          provider: credential_chain
    # Same as `lambda`, but S3 goes to an S3-compatible endpoint (moto server) with static
    # credentials. Used only by the S3 export tests and the image smoke test.
    s3_test:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '/tmp/headway.duckdb') }}"
      threads: 4
      extensions:
        - httpfs
      config_options:
        home_directory: /tmp
        extension_directory: "{{ env_var('HEADWAY_DUCKDB_EXTENSIONS', '/tmp/duckdb_extensions') }}"
      settings:
        TimeZone: UTC
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          region: "{{ env_var('AWS_DEFAULT_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('HEADWAY_S3_ENDPOINT') }}"
          url_style: path
          use_ssl: false
    # Defined only; not run in Release 1 local work.
    motherduck:
      type: duckdb
      path: "md:headway"
      threads: 4
      settings:
        TimeZone: UTC
      config_options:
        motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN') }}"

# The `edr report` CLI (Release 2.5, ADR-018) reads Elementary's result tables from the same
# DuckDB file the build wrote, with no extensions and no S3.
elementary:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('HEADWAY_DUCKDB_PATH', '.local/headway.duckdb') }}"
      schema: main
      threads: 1
      config_options:
        home_directory: /tmp
        extension_directory: "{{ env_var('HEADWAY_DUCKDB_EXTENSIONS', '/tmp/duckdb_extensions') }}"
      settings:
        TimeZone: UTC
