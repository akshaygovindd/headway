# Analytics tooling lives in its own environment: dbt-core pins protobuf<7 while
# the ingest runtime needs protobuf>=7. Never part of the Lambda zip.
[project]
name = "headway-dbt"
version = "0.1.0"
description = "dbt project environment for Headway"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dbt = [
    "dbt-core~=1.11.2",
    "dbt-duckdb~=1.10.0",
    # MotherDuck only supports specific DuckDB releases (2.0.1 was rejected, 1.5.6 recommended).
    # Keep in sync with docker/transform.Dockerfile, the root dev pin and ADR-012.
    "duckdb==1.5.6",
    # Elementary: the `edr` report CLI. Its dbt package version (headway/packages.yml) is the same
    # release, so the two never drift. It pins networkx<3, which dbt-core allows (ADR-018).
    "elementary-data[duckdb]==0.26.1",
    # Forecast serving (Release 3, ADR-019): the transform scores the next hour with the registered
    # LightGBM model, through the same headway_ml code the training uses.
    "lightgbm>=4.5",
    "numpy>=2",
    "pandas>=2.2",
]

[tool.uv]
package = false
default-groups = ["dbt"]
