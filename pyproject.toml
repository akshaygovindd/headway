[project]
name = "headway"
version = "0.1.0"
description = "Headway: Near-Real-Time Transit Reliability & AI Analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "pydantic>=2",
    "python-ulid>=4.2.0",
    "pyyaml",
]

[project.scripts]
headway = "headway.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]",
    "duckdb==1.5.6",
    "moto[s3,server]",
    "mypy",
    "pytest",
    "ruff",
    "types-protobuf>=7.35.1.20260906",
    "types-PyYAML",
]

# Streamlit app (app/); not part of the default sync or the Lambda zip.
app = [
    "pandas>=2.2",
    "plotly>=5.24",
    "pydeck>=0.9",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headway"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Page scripts hold long UI strings and Plotly hover templates.
"app/pages/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.transit.*", "pyarrow.*", "dbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests", "dbt"]
