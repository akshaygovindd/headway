[project]
name = "headway"
version = "0.1.0"
description = "Headway: Near-Real-Time Transit Reliability & AI Analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "protobuf>=7.36.2",
    "pydantic>=2",
    "python-ulid>=4.2.0",
    "pyyaml",
]

[project.scripts]
headway = "headway.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headway"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.transit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["tests"]
