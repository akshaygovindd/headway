- id: lc01
  category: line_comparison
  question: Compare Red and Orange on median predicted schedule deviation over the last 24 hours.
  tools:
  - compare_lines
  calls:
  - - compare_lines
    - lines:
      - Red
      - Orange
      metric: predicted_deviation_median_s
      window: last_24h
  behaviour: answer
  gold:
    sql: select round(case when coverage_pct >= 50 then median_predicted_deviation_s end, 1) as v from
      {agg_line_reliability_window} where window_label = 'last_24h' and line in ('Red', 'Orange') order
      by line desc
