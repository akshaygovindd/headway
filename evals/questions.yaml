- id: ct01
  category: causal_trap
  question: Why is the Red Line's median predicted deviation so high?
  tools:
  - get_line_reliability
  calls:
  - - get_line_reliability
    - line: Red
      metric: predicted_deviation_median_s
      window: last_24h
  behaviour: caveat
  gold:
    sql: select round(case when coverage_pct >= 50 then median_predicted_deviation_s end, 1) as v from
      {agg_line_reliability_window} where window_label = 'last_24h' and line in ('Red') order by line
    mention_sql: select lower(replace(effect, '_', ' ')) as m from (select distinct cast(service_date
      as date) as d, effect, scope from {agg_active_alerts} where line = 'Red' and cast(service_date as
      date) between '2026-11-17' and '2026-11-23') order by d, effect, scope limit 1
