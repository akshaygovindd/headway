    sql: select round(case when coverage_pct >= 50 then pct_on_time_window end, 1) as v, line as m from
      {agg_actual_deviation_window} where window_label = 'last_24h' and line in ('Green-B', 'Green-C',
      'Green-D') and coverage_pct >= 50 order by pct_on_time_window desc limit 1
