    - line: Orange
      metric: actual_deviation_median_s
      granularity: daily
      date_range:
        start: '2026-11-23'
        end: '2026-11-23'
  behaviour: answer
  gold:
    sql: select round(case when coverage_pct >= 50 then median_deviation_s end, 1) as v from {agg_actual_deviation_daily}
      where line = 'Orange' and cast(service_date as date) = '2026-11-23' order by direction_id
