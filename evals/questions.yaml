# Eval questions for the AI analyst (docs/EVALS.md). Gold answers are computed at run time
# from the frozen snapshot in evals/snapshot/ with the SQL of each entry: `{table}` is that table's
# Parquet, column `v` the numbers a correct answer states (null = withheld at under 50% coverage),
# column `m` the words it must mention (regular expressions). `calls` are the tool calls a good run
# makes (the fake LLM plays them); `tools` the tools a real run must use.
- id: ml01
  category: metric_lookup
  question: What was Blue's median predicted schedule deviation over the last 24 hours?
  tools:
  - get_line_reliability
  calls:
  - - get_line_reliability
    - line: Blue
      metric: predicted_deviation_median_s
      window: last_24h
  behaviour: answer
  gold:
    sql: select round(case when coverage_pct >= 50 then median_predicted_deviation_s end, 1) as v from
      {agg_line_reliability_window} where window_label = 'last_24h' and line in ('Blue') order by line
- id: ml02
  category: metric_lookup
