- id: so01
  category: service_vs_data_outage
  question: Was the Red Line disruption on 2026-11-22 a real service problem or a data problem? How many
    pipeline runs were there that day?
  tools:
  - get_pipeline_health
  - get_service_alerts
  calls:
  - - get_service_alerts
    - line: Red
      date_range:
        start: '2026-11-22'
        end: '2026-11-22'
  - - get_pipeline_health
    - date_range:
        start: '2026-11-22'
        end: '2026-11-22'
  behaviour: answer
  gold:
    sql: select count(*) as v from {agg_pipeline_health} where cast(scheduled_at at time zone 'America/New_York'
      as date) = '2026-11-22'
    mention_sql: select 'detour' as m
- id: so02
  category: service_vs_data_outage
  question: Is the data pipeline healthy? How many runs were there on 2026-11-23, and were there any failures?
  tools:
  - get_pipeline_health
  calls:
  - - get_pipeline_health
    - date_range:
        start: '2026-11-23'
        end: '2026-11-23'
  behaviour: answer
  gold:
    sql: select count(*) as v from {agg_pipeline_health} where cast(scheduled_at at time zone 'America/New_York'
      as date) = '2026-11-23'
- id: so03
  category: service_vs_data_outage
  question: Green-C had no-service alerts on 2026-11-22. Was there any pipeline failure that day?
  tools:
  - get_pipeline_health
  - get_service_alerts
  calls:
  - - get_service_alerts
    - line: Green-C
      date_range:
        start: '2026-11-22'
        end: '2026-11-22'
  - - get_pipeline_health
    - date_range:
        start: '2026-11-22'
        end: '2026-11-22'
  behaviour: answer
  gold:
    sql: select 'no service' as m where (select sum(vehicle_polls_error) + count(*) filter (where trip_updates_status
      <> 'ok') from {agg_pipeline_health} where cast(scheduled_at at time zone 'America/New_York' as date)
      = '2026-11-22') = 0
- id: so04
  category: service_vs_data_outage
  question: 'Red looks sparse on 2026-11-23: is it a pipeline outage or a service alert? Say how many
